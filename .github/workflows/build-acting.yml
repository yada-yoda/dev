# Regenerate acting/index.html from acting/data/ files whenever Decap
# (or anyone) commits changes to the data/. Also regenerates the
# favicon set + OG image + QR code when the favicon source or build
# script change. Commits the rebuilt files back, which triggers GH
# Pages to redeploy.

name: Build acting content

on:
  push:
    branches: [main]
    paths:
      - 'acting/data/**'
      - 'acting/.scripts/**'
      - 'acting/assets/favicon-192.png'
      - 'acting/assets/rizzo_logo_dark.png'
      - 'acting/assets/rizzo_logo_white.png'
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if the last commit was already this Action's auto-rebuild
    # (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip-rebuild]')"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install --quiet PyYAML Pillow qrcode

      - name: Regenerate generated assets (favicons, OG image, QR)
        working-directory: acting
        run: python .scripts/build-assets.py

      - name: Regenerate index.html from data/
        working-directory: acting
        run: python .scripts/build-content.py

      - name: Commit rebuilt files (if changed)
        run: |
          if git diff --quiet acting/index.html acting/assets acting/site.webmanifest; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acting/index.html acting/assets acting/site.webmanifest
          git commit -m "build: regenerate acting/ from data/ [skip-rebuild]"
          git push

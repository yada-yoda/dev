# Decap CMS configuration for rizzo.cc / dev.rizzo.cc/acting
#
# Auth: custom GitHub OAuth App proxied by a Cloudflare Worker.

backend:
  name: github
  repo: yada-yoda/dev
  branch: main
  base_url: https://acting-oauth.sevendwarfs.workers.dev
  auth_endpoint: auth

publish_mode: simple
site_url: https://dev.rizzo.cc/acting/
display_url: https://dev.rizzo.cc/acting/
logo_url: https://dev.rizzo.cc/acting/assets/rizzo_logo_dark.png

# Default media folder (overrideable per field below)
media_folder: "acting/assets/headshots"
public_folder: "/acting/assets/headshots"

collections:

  # ============ SITE SETTINGS ============
  # Site-level config split per topic so each entry is a focused edit.
  - name: "site"
    label: "Site Settings"
    description: "SEO + social previews, favicon, analytics, top-nav, footer, section visibility. One entry per topic."
    files:
      - file: "acting/data/seo.yml"
        label: "SEO + Social Previews"
        name: "seo"
        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page title (in browser tab + Google results)", name: "title", widget: "string", hint: "Keep under ~60 chars" }
              - { label: "Meta description", name: "description", widget: "text", hint: "Shown in Google results. Keep under ~155 chars" }
              - { label: "Canonical URL", name: "canonical_url", widget: "string", hint: "The single canonical home. Currently https://rizzo.cc/" }
              - { label: "Robots directive", name: "robots", widget: "string", hint: "Default: index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" }
              - { label: "Author", name: "author", widget: "string" }

          - label: "Open Graph (Social link previews)"
            name: "og"
            widget: "object"
            hint: "What Slack, iMessage, Discord, Twitter, etc. show when the link is shared."
            fields:
              - { label: "Site name", name: "site_name", widget: "string" }
              - { label: "OG type", name: "type", widget: "select", options: ["profile", "website", "article"] }
              - { label: "OG title", name: "title", widget: "string", hint: "Title shown on social previews; usually shorter than the SEO title" }
              - { label: "OG description", name: "description", widget: "text" }
              - { label: "OG image URL", name: "image", widget: "string", hint: "Absolute URL to a 1200x630 image. Run build-assets.py to regenerate the default if you change the logo." }
              - { label: "OG image alt text", name: "image_alt", widget: "string" }
              - { label: "Locale", name: "locale", widget: "string", default: "en_US" }

          - label: "Twitter / X"
            name: "twitter"
            widget: "object"
            fields:
              - { label: "Card type", name: "card", widget: "select", options: ["summary", "summary_large_image"] }

      - file: "acting/data/favicon.yml"
        label: "Favicon"
        name: "favicon"
        fields:
          - label: "Source image"
            name: "source"
            widget: "image"
            media_folder: "/acting/assets"
            public_folder: "/acting/assets"
            hint: "Upload a square image (512x512+ recommended) to replace assets/favicon-192.png. The GitHub Action will regenerate the full favicon set (16/32/180/192/512 + multi-res ICO + maskable) on commit."

      - file: "acting/data/analytics.yml"
        label: "Analytics"
        name: "analytics"
        fields:
          - { label: "GA4 Tracking ID", name: "ga4_id", widget: "string", hint: "e.g. G-XXXXXXXX. Currently shared with book/greenline (G-DYME377V2S)." }

      - file: "acting/data/menu.yml"
        label: "Top-Nav Menu"
        name: "menu"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Menu item"
            summary: "{{fields.label}} → {{fields.url}}"
            hint: "Reorder items by dragging up or down. Anchor links (#about) scroll within the page; full URLs go elsewhere."
            fields:
              - { label: "Label", name: "label", widget: "string", hint: "Visible text in the top nav (e.g. About)" }
              - { label: "URL", name: "url", widget: "string", hint: "Anchor (#about) or absolute URL" }

      - file: "acting/data/footer.yml"
        label: "Footer"
        name: "footer"
        fields:
          - label: "Footer text"
            name: "text"
            widget: "string"
            hint: "Use {{year}} for the current year (filled at runtime). Use {{version}} to control where the version chip lands - or just leave it out and toggle 'Show version' below to append it automatically."
          - { label: "Show version chip", name: "show_version", widget: "boolean", default: true, hint: "Tick to display the current site version (e.g. v0.7.3) in the footer." }

      - file: "acting/data/sections.yml"
        label: "Section Visibility (Show / Hide)"
        name: "sections"
        fields:
          - { label: "About (RIZZO definition + pull quote)", name: "about",           widget: "boolean", default: true }
          - { label: "Profile - Bio paragraph",               name: "profile_bio",     widget: "boolean", default: true }
          - { label: "Profile - Headshot gallery",            name: "profile_gallery", widget: "boolean", default: true }
          - { label: "Profile - Social links",                name: "profile_socials", widget: "boolean", default: true }
          - { label: "Resume (Stats / Training / Skills)",    name: "resume",          widget: "boolean", default: true }
          - { label: "Credits (Film / TV / Theater tabs)",    name: "credits",         widget: "boolean", default: true }
          - { label: "Reel (Selected Work block)",            name: "reel",            widget: "boolean", default: true }
          - { label: "Contact (bottom email section)",        name: "contact",         widget: "boolean", default: true }

  # ============ HERO ============
  - name: "hero"
    label: "Hero (Slideshow)"
    description: "Rotating background photos + paired two-line quotes. Each slide cycles every 8 seconds."
    files:
      - file: "acting/data/hero.yml"
        label: "Hero slides"
        name: "hero"
        fields:
          - label: "Slides"
            name: "slides"
            widget: "list"
            label_singular: "Slide"
            summary: "{{fields.quote_line_1}} / {{fields.quote_line_2}}"
            fields:
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                media_folder: "/acting/assets/slideshow/photos"
                public_folder: "/acting/assets/slideshow/photos"
                hint: "Upload an image or pick from the slideshow/photos folder. 1920×1080 target. Leave empty if using a video below."
              - label: "Video"
                name: "video"
                widget: "file"
                required: false
                media_folder: "/acting/assets/slideshow/videos"
                public_folder: "/acting/assets/slideshow/videos"
                hint: "OR upload an MP4 reel clip. If set, video plays in place of photo. Keep clips short (8-15s) and small (< ~25MB)."
              - { label: "Quote line 1", name: "quote_line_1", widget: "string", required: false, hint: "First line of the overlaid quote. Leave blank for slides where the visual speaks for itself." }
              - { label: "Quote line 2", name: "quote_line_2", widget: "string", required: false, hint: "Second line of the overlaid quote." }

  # ============ HEADSHOTS ============
  - name: "headshots"
    label: "Headshots"
    description: "The large profile photo + the thumbnail row under the social links. First entry is the one that loads by default."
    files:
      - file: "acting/data/headshots.yml"
        label: "Headshot gallery"
        name: "headshots"
        fields:
          - label: "Looks"
            name: "entries"
            widget: "list"
            label_singular: "Headshot"
            summary: "{{fields.label}}"
            hint: "The FIRST entry loads as the large photo. Every entry also shows as a 65px thumbnail — clicking one swaps it into the large slot. Drag to reorder; drag a different look to the top to change the default. Upload square-ish images at 800x800 or larger."
            fields:
              - label: "Photo"
                name: "image"
                widget: "image"
                media_folder: "/acting/assets/headshots"
                public_folder: "assets/headshots"
                hint: "Upload a new look or pick an existing one from assets/headshots/."
              - { label: "Label", name: "label", widget: "string", hint: "Short name for this look, e.g. 'Suit and tie', 'Casual quarter-zip', 'Dramatic B&W'. Shown as the thumbnail's accessible name and in the list summary above." }
              - { label: "Alt text", name: "alt", widget: "string", hint: "Describes the photo for screen readers and search engines. Include wardrobe + backdrop, e.g. 'Frank Rizzo, Chicago-based actor — smiling color headshot, gray quarter-zip, white backdrop'." }

  # ============ BIO ============
  - name: "bio"
    label: "Bio"
    description: "Short third-person paragraph next to the headshot. Use **bold** for school names and *italic* for film titles."
    files:
      - file: "acting/data/bio.md"
        label: "Bio paragraph"
        name: "bio"
        fields:
          - { label: "Body", name: "body", widget: "markdown", buttons: ["bold", "italic", "link"] }

  # ============ ABOUT ============
  - name: "about"
    label: "About (Definition + Pull Quote)"
    description: "The RIZZO dictionary entry and the pull quote on the right."
    files:
      - file: "acting/data/about.yml"
        label: "About content"
        name: "about"
        fields:
          - label: "Definition"
            name: "definition"
            widget: "object"
            fields:
              - { label: "Word", name: "word", widget: "string" }
              - { label: "Part of speech", name: "part_of_speech", widget: "string" }
              - { label: "Pronunciation", name: "pronunciation", widget: "string" }
              - label: "Pronunciation audio (optional)"
                name: "pronunciation_audio"
                widget: "file"
                required: false
                media_folder: "/acting/assets/audio"
                public_folder: "/acting/assets/audio"
                hint: "Upload an MP3 or WAV of the name being spoken. A speaker icon appears next to Pronunciation on the live site - clicking it plays this audio. Leave blank to use the browser's built-in voice (it will say the text below)."
              - { label: "Spoken text (fallback for browser voice)", name: "speak_text", widget: "string", required: false, default: "Rizzo", hint: "If no audio file is uploaded above, the browser's text-to-speech voice will say this word when the speaker icon is clicked." }
              - label: "Entries"
                name: "entries"
                widget: "list"
                field: { label: "Definition line", name: "text", widget: "string" }
          - label: "Pull Quotes / Facts"
            name: "pull_quotes"
            widget: "list"
            label_singular: "Quote or Fact"
            summary: "{{fields.text}}"
            hint: "Add as many as you want. With 1 item it displays statically; with 2 or more, they rotate every 7s in a left-slide carousel. Attribution is optional - leave blank for an interesting fact that doesn't have a source."
            fields:
              - { label: "Quote text or fact", name: "text", widget: "text" }
              - { label: "Attribution (optional)", name: "attribution", widget: "string", required: false, hint: "e.g. 'Random Girl, 2023'. Leave blank for facts." }

  # ============ CREDITS ============
  # Each credit type is its own file so clicking Credits in the sidebar
  # shows Film / TV / Theater / Commercial as separate entries.
  # A fifth "Tab Visibility" entry holds the show/hide toggles for each tab.
  - name: "credits"
    label: "Credits"
    description: "Film, TV, Theater, Commercial credits. Newest at the top. Click an entry to edit just that credit type. Tab Visibility controls which tabs show on the live site."
    files:
      - file: "acting/data/credits-tabs.yml"
        label: "Tab Visibility (Show / Hide)"
        name: "credits_tabs"
        fields:
          - label: "Tabs"
            name: "tabs"
            widget: "object"
            hint: "Toggle which credit tabs appear on the website. Hidden tabs disappear entirely (no empty placeholder). The first visible tab opens by default. The printed PDF resume always omits Commercial regardless."
            fields:
              - { label: "Show Film tab",       name: "film",       widget: "boolean", default: true }
              - { label: "Show TV tab",         name: "tv",         widget: "boolean", default: true }
              - { label: "Show Theater tab",    name: "theater",    widget: "boolean", default: true }
              - { label: "Show Commercial tab", name: "commercial", widget: "boolean", default: false, hint: "Off by default. Turn on once you have commercial credits to display." }

      - file: "acting/data/theater-footnotes.yml"
        label: "Theater Footnotes & Strict Mode"
        name: "theater_footnotes"
        fields:
          - label: "Strict Mode (drop stage names, show parent company)"
            name: "strict_mode"
            widget: "boolean"
            default: false
            hint: "When ON, each Theater venue cell is replaced with the matching footnote's 'short' text (the parent company, e.g. 'The Second City') and the footnote list at the bottom is hidden. Use this for agency theatrical submissions that follow the strict 'producing company only' resume convention. Stage detail is preserved in the data — Strict Mode is purely a render toggle, you can flip back any time."
          - label: "Footnote definitions"
            name: "footnotes"
            widget: "list"
            label_singular: "Footnote"
            summary: "{{fields.marker}} → {{fields.long}}"
            hint: "Each row defines what a footnote marker means. Only markers used by at least one theater entry will actually render. To add a new marker (say ** for 'Workshop production'), add a row here and set that marker on the relevant entries."
            fields:
              - label: "Marker"
                name: "marker"
                widget: "string"
                hint: "The symbol used on theater entries — *, **, †, ‡, ¹, ², ³, etc."
              - { label: "Long form (footnote text)", name: "long", widget: "string", hint: "The full text shown at the bottom of the Theater section, e.g. 'The Second City Training Center, Chicago'." }
              - { label: "Short form (Strict Mode replacement)", name: "short", widget: "string", hint: "Used when Strict Mode is ON — replaces the stage name in the venue cell. Keep it short to fit the column, e.g. 'The Second City'." }

      - file: "acting/data/film.yml"
        label: "Film"
        name: "film"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Film credit"
            summary: "{{fields.title}} ({{fields.type}}, {{fields.year}})"
            add_to_top: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Year", name: "year", widget: "number", value_type: "int", min: 1900, max: 2099 }
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["Short", "Feature", "Web Series", "Music Video"]
                default: "Short"
              - { label: "Role / Character", name: "role", widget: "string" }
              - { label: "Director", name: "director", widget: "string" }
              - { label: "IMDB tt ID", name: "imdb", widget: "string", required: false, hint: "e.g. tt12345678 - leave blank to fall back to IMDB search by title" }

      - file: "acting/data/tv.yml"
        label: "TV"
        name: "tv"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "TV credit"
            summary: "{{fields.title}} ({{fields.season}})"
            add_to_top: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Season", name: "season", widget: "string", hint: "e.g. S01, S02 E04" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Network", name: "network", widget: "string" }

      - file: "acting/data/theater.yml"
        label: "Theater"
        name: "theater"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Theater credit"
            summary: "{{fields.production}} — {{fields.venue}}{{fields.footnote}}"
            add_to_top: true
            hint: "All current entries are at Second City stages and use the * footnote. For a non-Second City credit, set Footnote marker to '— None —' and the entry won't be covered by the * footnote."
            fields:
              - { label: "Production", name: "production", widget: "string" }
              - { label: "Role / Sketches", name: "role", widget: "string", default: "Ensemble", hint: "Use Ensemble for ensemble work; for sketch shows, comma-separate the sketch names" }
              - { label: "Stage / Venue", name: "venue", widget: "string", default: "New Judy's Beat Lounge", hint: "Just the specific stage name (e.g. Donny's Skybox, New Judy's Beat Lounge, De Maat Studio). For non-Second City credits, enter the actual venue name." }
              - label: "Footnote marker"
                name: "footnote"
                widget: "select"
                required: false
                default: "*"
                hint: "Marks this venue with a superscript symbol. The matching footnote text at the bottom of the Theater section is set in Credits > Theater Footnotes & Strict Mode. Pick '— None —' for credits that don't need a footnote."
                options:
                  - { label: "— None —",            value: "" }
                  - { label: "* (asterisk)",        value: "*" }
                  - { label: "** (double asterisk)", value: "**" }
                  - { label: "† (dagger)",          value: "†" }
                  - { label: "‡ (double dagger)",   value: "‡" }
                  - { label: "¹ (superscript 1)",   value: "¹" }
                  - { label: "² (superscript 2)",   value: "²" }
                  - { label: "³ (superscript 3)",   value: "³" }

      - file: "acting/data/commercial.yml"
        label: "Commercial"
        name: "commercial"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Commercial credit"
            summary: "{{fields.title}} — {{fields.brand}}"
            add_to_top: true
            required: false
            hint: "Empty by default. Add entries here when you book commercial work, then flip Site Settings > Credits Tabs > 'Show Commercial tab' to ON."
            fields:
              - { label: "Title / Spot", name: "title", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Brand / Agency", name: "brand", widget: "string" }

  # ============ TRAINING ============
  - name: "training"
    label: "Training"
    description: "Education and training history. Newest classes at the top."
    files:
      - file: "acting/data/training.yml"
        label: "Training entries"
        name: "training"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Training entry"
            summary: "{{fields.title}} — {{fields.school}}"
            add_to_top: true
            fields:
              - { label: "Course / Show Title", name: "title", widget: "string" }
              - label: "Kind / Badge"
                name: "kind"
                widget: "select"
                required: false
                default: ""
                hint: "Optional small badge shown next to the title. Pick None for no badge. To add a value not listed here, edit acting/admin/config.yml > training > kind > options."
                options:
                  - { label: "— None —",      value: "" }
                  - { label: "Workshop",      value: "Workshop" }
                  - { label: "Class",         value: "Class" }
                  - { label: "Intensive",     value: "Intensive" }
                  - { label: "Masterclass",   value: "Masterclass" }
                  - { label: "Conservatory",  value: "Conservatory" }
                  - { label: "Showcase",      value: "Showcase" }
                  - { label: "Revue",         value: "Revue" }
                  - { label: "Coaching",      value: "Coaching" }
                  - { label: "Course",        value: "Course" }
              - { label: "Teacher(s)", name: "teachers", widget: "string", required: false }
              - { label: "School / Location", name: "school", widget: "string" }

  # ============ STATS, SKILLS & INFLUENCES ============
  # Split into 7 per-topic files so each entry in the sidebar is a focused
  # edit (Physical, Measurements, Languages, Licensing, Skills, Films, Inspirations).
  - name: "panels"
    label: "Stats, Skills & Influences"
    description: "Resume panels — physical, measurements, languages, licensing, key skills, favorite films, inspirations. One entry per topic."
    files:
      - file: "acting/data/physical.yml"
        label: "Physical"
        name: "physical"
        fields:
          - { label: "Age Range", name: "age_range", widget: "string" }
          - { label: "Height", name: "height", widget: "string" }
          - { label: "Eyes", name: "eyes", widget: "string" }
          - { label: "Hair", name: "hair", widget: "string" }
          - { label: "Tattoos", name: "tattoos", widget: "string" }
          - { label: "Piercings", name: "piercings", widget: "string" }

      - file: "acting/data/measurements.yml"
        label: "Measurements"
        name: "measurements"
        fields:
          - { label: "Shoe", name: "shoe", widget: "string" }
          - { label: "Shirt", name: "shirt", widget: "string" }
          - { label: "Coat", name: "coat", widget: "string" }
          - { label: "Neck", name: "neck", widget: "string" }
          - { label: "Sleeve", name: "sleeve", widget: "string" }
          - { label: "Hat", name: "hat", widget: "string" }

      - file: "acting/data/languages.yml"
        label: "Languages"
        name: "languages"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Language"
            summary: "{{fields.name}} ({{fields.level}})"
            fields:
              - { label: "Language", name: "name", widget: "string" }
              - { label: "Level / Note", name: "level", widget: "string" }

      - file: "acting/data/licensing.yml"
        label: "Licensing & Hire"
        name: "licensing"
        fields:
          - label: "Documents"
            name: "documents"
            widget: "list"
            field: { label: "Document", name: "doc", widget: "string" }
          - { label: "Union status", name: "union", widget: "string" }
          - { label: "Local Hire", name: "local_hire", widget: "string" }

      - file: "acting/data/skills.yml"
        label: "Key Skills"
        name: "skills"
        fields:
          - label: "Skills paragraph"
            name: "text"
            widget: "text"
            hint: "One paragraph. Separate items with ' · ' (space-middot-space). Industry rule of thumb: 8-12 high-impact items beats a long list of hobbies."

      - file: "acting/data/favorite-films.yml"
        label: "Favorite Films"
        name: "favorite_films"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Film"
            summary: "{{fields.title}} — {{fields.director}}, {{fields.year}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Director", name: "director", widget: "string" }
              - { label: "Year", name: "year", widget: "number", value_type: "int", min: 1900, max: 2099 }

      - file: "acting/data/inspirations.yml"
        label: "Inspirations"
        name: "inspirations"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            field: { label: "Name", name: "name", widget: "string" }
            hint: "Directors, creators, actors that inform the work — one per entry."

  # ============ CONTACT, SOCIALS, REEL ============
  # Split into 3 per-topic files (contact info, social links, reel).
  - name: "contact"
    label: "Contact, Socials, Reel"
    description: "Public email + bottom Contact section copy, social link pills, and the reel embed. One entry per topic."
    files:
      - file: "acting/data/contact.yml"
        label: "Contact (email + section copy)"
        name: "contact"
        fields:
          - { label: "Email", name: "email", widget: "string", hint: "Public-facing contact address." }
          - label: "Contact Section"
            name: "contact_section"
            widget: "object"
            hint: "The heading + body copy at the very bottom of the page."
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }

      - file: "acting/data/socials.yml"
        label: "Social Links"
        name: "socials"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            label_singular: "Social link"
            summary: "{{fields.platform}}"
            fields:
              - label: "Platform"
                name: "platform"
                widget: "select"
                options: ["Instagram", "Letterboxd", "IMDb", "Actors Access", "Email"]
                hint: "Only these five have icons; other names will render without an icon."
              - { label: "URL", name: "url", widget: "string" }

      - file: "acting/data/reel.yml"
        label: "Reel"
        name: "reel"
        fields:
          - label: "Reel URL"
            name: "url"
            widget: "string"
            required: false
            hint: "Vimeo or YouTube embed URL, e.g. https://player.vimeo.com/video/12345678. Leave blank to use a file upload below."
          - label: "Reel file (upload)"
            name: "file"
            widget: "file"
            required: false
            media_folder: "/acting/assets/reel"
            public_folder: "/acting/assets/reel"
            hint: "Optional: upload an MP4 directly. URL above wins if both are set."
          - { label: "Placeholder text (when no reel set)", name: "placeholder", widget: "string", default: "Reel coming soon" }

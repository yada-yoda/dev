# Site-level settings: SEO meta, Open Graph / Twitter card, favicon
# source, analytics. The build script regenerates the matching tags
# in index.html <head>.

seo:
  title: "Frank Rizzo — Actor | Rizzo.cc"
  description: "Frank Rizzo — Chicago-based actor. Trained at The Second City and Acting Studio Chicago. Film & TV credits, headshot, training, contact, downloadable resume."
  canonical_url: "https://rizzo.cc/"
  robots: "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
  author: "Frank Rizzo"

og:
  site_name: "Rizzo.cc"
  type: "profile"
  title: "Frank Rizzo — Actor"
  description: "Chicago-based actor. Trained at The Second City and Acting Studio Chicago. Film & TV credits, headshot, training, contact."
  image: "https://rizzo.cc/assets/og-image.png"
  image_alt: "Rizzo.cc — Frank Rizzo, Chicago-based actor"
  locale: "en_US"

twitter:
  card: "summary_large_image"

favicon:
  # Source image for the favicon set. The Action runs build-assets.py
  # whenever this file changes to regenerate the multi-resolution set:
  # 16/32/180/192/512 PNG + multi-res ICO + maskable.
  # Upload a square image at least 512x512 for clean downscaling.
  source: "assets/favicon-192.png"

analytics:
  # Currently shared with book/greenline. Swap to a different ID to
  # track this site separately.
  ga4_id: "G-DYME377V2S"

# Show / hide each Credits tab on the website. The first visible tab
# gets the active state. The printed PDF resume always omits Commercial.
credits_tabs:
  film: true
  tv: true
  theater: true
  commercial: false

# Show / hide individual sections without losing their data. Set any
# of these to false to make that section disappear from the live site
# (the data still lives in its YAML file, ready to come back).
sections:
  about: true             # RIZZO definition + "Random Girl" pull quote section
  profile_bio: true       # bio paragraph next to the headshot
  profile_gallery: true   # 65px headshot thumbnail row under the socials
  profile_socials: true   # Instagram / Letterboxd / IMDb / Actors Access / Email pills
  resume: true            # the whole Resume section (panels + training)
  credits: true           # the whole Credits section (filmography tabs)
  reel: true              # the "Reel — Selected Work" block under credits
  contact: true           # the bottom Contact section (heading + email)

# Top-nav menu items. Each entry has a visible label and a URL.
# Use anchor links (#about) to scroll within the page, or full URLs
# to link elsewhere. Reorder by moving items up/down in the list.
menu:
  - label: "About"
    url: "#about"
  - label: "Resume"
    url: "#resume"
  - label: "Credits"
    url: "#credits"
  - label: "Contact"
    url: "#contact"

# Footer text. Token {{year}} is replaced at runtime with the current
# year. Token {{version}} is replaced at build time with the site
# version (hardcoded in build-content.py). Set show_version to false
# to hide the version chip entirely.
footer:
  text: "© {{year}} Rizzo.cc"
  show_version: true

# Theater credits — edited via Decap CMS at /acting/admin/.
# Newest credits go at the TOP of the list.
#
# Each entry can have an optional "footnote" marker (*, **, †, ‡, ¹, ², ³, ...)
# The marker renders as superscript next to the venue, and the matching
# footnote text appears at the bottom of the Theater section. Markers
# and their meanings live in data/theater-footnotes.yml.
# Strict Mode (in theater-footnotes.yml) swaps the venue cell for the
# parent venue name and hides the footnote — for agency submissions
# that follow the strict "producing company only" resume convention.
#
# Optional "url" turns the production name into a link on the website
# (e.g. a show page with tickets). The printed resume never links.


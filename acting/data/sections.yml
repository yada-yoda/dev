# Show / hide individual sections without losing their data. Set any
# of these to false to make that section disappear from the live site
# (the data still lives in its YAML file, ready to come back).
#
# (Credits tab visibility lives in data/credits-tabs.yml so it sits
# next to the credit lists in Decap.)

about: true             # RIZZO definition + "Random Girl" pull quote section
profile_bio: true       # bio paragraph next to the headshot
profile_gallery: true   # 65px headshot thumbnail row under the socials
profile_socials: true   # Instagram / Letterboxd / IMDb / Actors Access / Email pills
resume: true            # the whole Resume section (panels + training)
credits: true           # the whole Credits section (filmography tabs)
reel: true              # the "Reel — Selected Work" block under credits
contact: true           # the bottom Contact section (heading + email)

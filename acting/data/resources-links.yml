# Resources page - the link list. Three levels:
#   sections  -> the big headings (each also becomes a filter chip)
#   groups    -> small caps sub-headings inside a section
#   entries   -> one card per link
#
# Entry fields:
#   name     - card title
#   desc     - one line under the title (what it is / why it's here)
#   url      - full URL
#   kind     - fb | web | gov | school | book  (sets the icon + type pill)
#   private  - true for request-to-join groups (shows a Private pill)
#
# `id` must be a short lowercase slug with no spaces; it becomes the
# section anchor (#s-casting) and the chip's filter key. `chip` is the
# short label on the filter chip.

sections:
  - id: casting
    title: "Casting, Background & Stand-in"
    chip: "Casting"
    groups:

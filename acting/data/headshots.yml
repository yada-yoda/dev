# Headshot gallery - edited via Decap CMS at /acting/admin/.
#
# The FIRST entry is the large headshot shown when the page loads, AND the
# photo on the printed resume (Save Resume PDF), AND the small thumb on
# /reel - one choice drives all three, so drag a different look to the top
# in the CMS to change them together.
# Every entry also renders as a 65px thumbnail under the social links;
# clicking a thumbnail swaps it into the large slot.
#
# Upload square-ish images (800x800 or larger). The large slot renders
# at 280x280 and thumbnails at 65x65, both cropped to fill, so anything
# close to square works. Very wide or very tall photos get cropped hard.

entries:
  - image: "assets/headshots/04-navy-polo.jpg"
    alt: "Frank Rizzo, Chicago-based actor - broad smile color headshot, navy dress shirt, white backdrop"
    label: "Navy dress shirt"
    # Optional print-ready PDF of this look. Renders as a PDF tile at the end
    # of the thumbnail row, but only once the file actually exists on disk.
    pdf: "assets/headshots/frank-rizzo-headshot.pdf"
  - image: "assets/headshots/01-main.jpg"
    alt: "Frank Rizzo, Chicago-based actor - front-facing color headshot, suit and tie, blue backdrop"
    label: "Suit and tie"
  - image: "assets/headshots/02-quarter-zip.jpg"
    alt: "Frank Rizzo, Chicago-based actor - smiling color headshot, gray quarter-zip over navy collar, white backdrop"
    label: "Casual quarter-zip"
  - image: "assets/headshots/03-glasses.jpg"
    alt: "Frank Rizzo, Chicago-based actor - smiling color headshot with glasses, light blue button-up over black tee, warm gray backdrop"
    label: "Glasses, button-up"

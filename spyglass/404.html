<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<title>404 — Spyglass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f6f7fb; --surface:#ffffff; --border:#e3e6ef; --text:#1d2333;
    --muted:#6b7280; --primary:#4f46e5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1220; --surface:#171a2b; --border:#2a2f48; --text:#e7e9f3;
      --muted:#9aa0b4; --primary:#7c75f5;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:1rem;
  }
  .card{
    text-align:center; background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:3rem 2.5rem; max-width:440px;
    box-shadow:0 8px 30px rgba(20,24,40,.12);
  }
  .lens{
    width:88px; height:88px; border-radius:50%; background:var(--primary);
    margin:0 auto 1.2rem; position:relative; animation:sweep 3.2s ease-in-out infinite;
  }
  .lens::after{
    content:""; position:absolute; inset:0; margin:auto; width:30px; height:30px;
    border-radius:50%; background:#fff;
  }
  @keyframes sweep{
    0%,100%{transform:translateX(-14px) rotate(-6deg)}
    50%{transform:translateX(14px) rotate(6deg)}
  }
  h1{font-size:2.2rem; margin:0 0 .3rem}
  p{color:var(--muted); margin:.3rem 0 1.6rem; line-height:1.55}
  a.btn{
    display:inline-block; background:var(--primary); color:#fff; text-decoration:none;
    font-weight:600; padding:.65rem 1.4rem; border-radius:10px; font-size:.95rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lens" role="img" aria-label="Spyglass searching"></div>
    <h1>404</h1>
    <p>We watched this spot very closely,<br>but the page you're after never showed up.</p>
    <a class="btn" href="/spyglass/">Back to your monitors</a>
  </div>
</body>
</html>

<style>
/* Token palette copied from dev/pawprints (dark theme). Dark-only for v0.1. */
:root{--bg-primary:#0d1117;--bg-card:#161b22;--bg-tertiary:#21262d;--text-primary:#e6edf3;--text-secondary:#8b949e;

font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}

.wrap{max-width:1760px;margin:0 auto;
padding:max(20px,env(safe-area-inset-top)) max(clamp(16px,3vw,40px),env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(clamp(16px,3vw,40px),env(safe-area-inset-left))}
h1{font-size:24px;line-height:1.2;margin:0}
h2{font-size:15px;margin:0 0 10px;letter-spacing:.01em}
.muted{color:var(--text-secondary)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:0 0 16px;min-width:0}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center}
.center .card{max-width:420px;width:100%;text-align:center;padding:28px 22px}
.center h2{font-size:20px;margin-bottom:8px}
.center p{margin:0 0 18px}
button{font:inherit;cursor:pointer;border-radius:8px;min-height:40px;padding:8px 16px;border:1px solid var(--border);
background:var(--bg-tertiary);color:var(--text-primary)}
button:hover{border-color:var(--text-secondary)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button.primary{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:0 0 18px}
.hdr .who{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.updated{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 16px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}

.tile.bad{background:var(--danger-tint);border-color:var(--danger-border)}
.tile.bad .num{color:var(--danger)}
.failing{border-color:var(--danger-border);background:var(--danger-tint)}
.failing ul{margin:0;padding:0;list-style:none}
.failing li{padding:8px 0;border-top:1px solid var(--danger-border);overflow-wrap:anywhere}
.failing li:first-child{border-top:0;padding-top:0}
.failing .pid{font-weight:600}
.err{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;color:var(--text-primary)}
/* One block per (error, account); lines capped so the full-width card stays readable on wide screens. */
.failing li.fgroup{padding:12px 0}
.failing li.fgroup:first-child{padding-top:0}
.fgroup p{margin:0 0 8px;max-width:75ch}
.fgroup .fprojects{margin:0 0 10px}
.fgroup .fprojects li{border-top:0;padding:2px 0}
.fgroup .fprojects .when{display:inline}
.fgroup .reported{font-size:13px;margin:8px 0 0}
.cmd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:75ch;margin:0 0 4px}
.cmd code{flex:1 1 16em;min-width:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;
background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:9px 12px;
overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
/* Projects + aside: one column (Projects, Recent sign-ups, Email alerts) until there is room for two. */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;margin:0 0 16px}
.layout>*,.aside>*{min-width:0}

@media (min-width:1180px){.layout{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
/* Email alerts */

.arow:first-of-type{border-top:0}

/* Off: grey ring + grey knob (3:1+ on the card). On: teal track, dark knob. */
.sw{-webkit-appearance:none;appearance:none;margin:0;flex:none;position:relative;width:44px;height:26px;border-radius:999px;
border:2px solid var(--text-secondary);background:var(--bg-card);cursor:pointer}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-secondary);transition:transform .12s}
.sw:checked{background:var(--accent-2);border-color:var(--accent-2)}
.sw:checked::before{transform:translateX(18px);background:var(--on-accent)}
.sw:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
/* .65 keeps the dimmed off ring at 3.15:1; the row text, not the dimming, says why it is disabled. */

.sw[aria-busy="true"]{cursor:progress}
@media (prefers-reduced-motion:reduce){.sw::before{transition:none}}

.aerr:empty{display:none}
.alerts-msg{margin:0}

.toast-wrap{position:fixed;left:0;right:0;top:max(12px,calc(env(safe-area-inset-top) + 8px));z-index:50;

table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
thead th{border-top:0;font-size:13px;font-weight:600;color:var(--text-secondary);padding:0}
thead th button{width:100%;text-align:left;background:none;border:0;border-radius:6px;color:inherit;padding:8px 10px;min-height:36px;font-weight:600}
thead th button:hover{color:var(--text-primary)}
thead th[aria-sort="ascending"] button,thead th[aria-sort="descending"] button{color:var(--accent)}
.arrow{display:inline-block;width:1em;margin-left:4px}
col.c-sites{width:40%}col.c-users{width:14%}col.c-status{width:16%}col.c-last{width:30%}
td.num{font-variant-numeric:tabular-nums}
.status{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px}
.status.ok{color:var(--success);background:rgba(63,185,80,.12)}
.status.fail{color:var(--danger);background:var(--danger-tint)}
.pidsub{display:block;font-size:12px;color:var(--text-secondary)}
.events{list-style:none;margin:0;padding:0}
.events li{padding:10px 0;border-top:1px solid var(--border);overflow-wrap:anywhere}
.events li:first-child{border-top:0;padding-top:0}
.events .site{font-weight:600;color:var(--accent)}
.events .sep{color:var(--text-secondary);padding:0 6px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bg-tertiary);color:var(--text-secondary);border:1px solid var(--border);margin-left:4px}
.when{font-size:13px;color:var(--text-secondary)}
.note{font-size:13px;margin:10px 0 0}
/* Users count as an expand control: looks like the cell text, not a big button. */
.ubtn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 8px;margin:-4px -8px;border:0;border-radius:6px;
background:none;color:var(--text-primary);font-weight:600;font-variant-numeric:tabular-nums}
.ubtn:hover{background:var(--bg-tertiary)}
.ubtn .chev{display:inline-block;width:.8em;color:var(--accent-2);transition:transform .15s}
.ubtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.ubtn .chev{transition:none}}
@media (pointer:coarse){.ubtn{min-height:44px;min-width:44px;margin:0 -8px}}
/* Touch: every button, select and switch row reaches 44px (header buttons are 40px for mouse). */
@media (pointer:coarse){button,select,thead th button{min-height:44px}.aswitch{min-height:48px}}
tr.xrow[hidden]{display:none}
tr.xrow td{border-top:0;padding-top:0}
.roster-box{background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;padding:4px 12px;font-size:14px}
.roster{list-style:none;margin:0;padding:0}
.roster li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-top:1px solid var(--border);overflow-wrap:anywhere}
.roster li:first-child{border-top:0}
.roster .chip{margin-left:6px}
.rname{font-weight:600}
.remail{display:block;color:var(--text-secondary)}
.rlbl{display:block;font-size:12px;color:var(--text-secondary)}
.rlbl[title]{cursor:help;text-decoration:underline dotted;text-underline-offset:2px}
.rnote{margin:8px 0;font-size:13px}
@media (max-width:760px){
  .roster li{grid-template-columns:minmax(0,1fr);gap:2px}
  .rwhen{display:grid;grid-template-columns:minmax(0,6.5em) minmax(0,1fr);gap:8px;align-items:baseline}
}
@media (max-width:640px){
  .mobile-only{display:flex}
  table,tbody,tr,td{display:block;width:100%}
  thead,colgroup{display:none}
  tr{border-top:1px solid var(--border);padding:10px 0}
  tbody tr:first-child{border-top:0;padding-top:0}
  td{border-top:0;padding:3px 0;display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:8px}
  td::before{content:attr(data-label);color:var(--text-secondary);font-size:13px}
  tr.xrow{border-top:0;padding:0 0 10px}
  tr.xrow td{display:block;padding:0}
  tr.xrow td::before{content:none}
  .roster-box{padding:2px 10px}
}
</style>

<script>
'use strict';
var VERSION = '0.3.0';
var WORKER = 'https://pawprints-worker.sevendwarfs.workers.dev';
// Client-side check is only for a friendly message. The worker enforces the owner
// email (verified token claim) on GET /signupwatch and returns 403 to anyone else.
var OWNER_EMAIL = 'frank.l.rizzo@gmail.com';
var FIREBASE_CONFIG = {
  apiKey:"AIzaSyCR7AHHq8nIu_k7usHiItQCJIu_6Lo-p6A",authDomain:"illnesstracker-8d888.firebaseapp.com",
  projectId:"illnesstracker-8d888",storageBucket:"illnesstracker-8d888.firebasestorage.app",
  messagingSenderId:"660525580864",appId:"1:660525580864:web:ba78d04b13147a2b34d5a5"
};
var DAY = 86400000;
var DEFAULT_SORT = { key: 'users', dir: 'desc', isDefault: true };
var sort = { key: 'users', dir: 'desc', isDefault: true };
var dash = null;
var currentUser = null;
// projectId -> 1 for rosters the owner has expanded; survives re-sorts and refreshes.
var openRows = Object.create(null);
var NO_ROSTER_TIP = 'User list arrives with the next daily check (08:10).';
var LAST_SIGNIN_TIP = 'Most recent sign-in Firebase recorded. Firebase doesn\'t expose a login count.';
// Email alert settings live in the worker, fetched separately from the dashboard so a
// settings failure never blanks the page. state: 'loading' | 'error' | 'ready'.
var alerts = { state: 'loading', reason: '', settings: null, pending: {}, rowErr: {}, seq: 0 };
var ALERT_ROWS = [
  { key: 'emailNewSignups', name: 'New sign-ups', desc: 'Email me when someone new creates an account on any watched site.' },
  { key: 'emailAnonymous', name: 'Guest sessions too', desc: 'Include visitors who sign in without an email address. Off by default: a guest session has no name or email to act on.' },
  { key: 'emailFailures', name: 'Failed checks', desc: 'Email me when a project cannot be checked, at most once a week.' }
];
var REAUTH_RE = /credentials are no longer valid|login --reauth/i;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtFull(ms){
  if(typeof ms !== 'number' || !isFinite(ms)) return '';
  return new Date(ms).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}
function fmtDate(ms){
  if(typeof ms !== 'number' || !isFinite(ms)) return 'unknown date';
  return new Date(ms).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
// Relative time from a ms timestamp: "just now", "12 min ago", "5 h ago", "yesterday",
// "9 days ago", "3 mo ago", "1.4 yr ago". Past the first hour it counts local calendar
// days, so something from 11pm last night reads "yesterday" the next morning.
function relTime(ms){
  if(typeof ms !== 'number' || !isFinite(ms)) return 'never';
  var now = Date.now(), diff = now - ms;
  if(diff < 0) diff = 0;
  if(diff < 60000) return 'just now';
  if(diff < 3600000) return Math.floor(diff/60000) + ' min ago';
  var n = new Date(now), d = new Date(ms);
  var days = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate()))/DAY);
  if(days === 0) return Math.floor(diff/3600000) + ' h ago';
  if(days === 1) return 'yesterday';
  if(days <= 90) return days + ' days ago';
  if(days <= 730) return Math.round(days/30.44) + ' mo ago';
  return (days/365.25).toFixed(1) + ' yr ago';
}
function sitesStr(p){ return (Array.isArray(p.sites) && p.sites.length ? p.sites : [p.projectId || '?']).join(' / '); }
// The watcher captures firebase-tools output verbatim, terminal colour codes included.
// Strip real ANSI sequences, then any "[1m"-style leftovers whose ESC byte was lost.
function cleanErr(s){
  return String(s == null ? '' : s).replace(/\x1b\[[0-9;]*[A-Za-z]/g, '').replace(/\[\d{1,3}(;\d{1,3})*m/g, '').trim();
}

// ---------- toast (passive confirmations only) ----------
var toastTimer = null, toastClear = null;
function toast(msg){
  var el = $('toast');
  if(!el) return;
  clearTimeout(toastTimer); clearTimeout(toastClear);
  // Empty first so a repeated identical message is announced again.
  el.textContent = '';
  el.classList.remove('show');
  setTimeout(function(){
    el.textContent = msg;
    el.classList.add('show');
    toastTimer = setTimeout(function(){
      el.classList.remove('show');
      toastClear = setTimeout(function(){ el.textContent = ''; }, 200);
    }, 3500);
  }, 30);
}
function copyText(text){
  var fallback = function(){
    var ta = document.createElement('textarea'), ok = false;
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  };
  var done = function(ok){ toast(ok ? 'Command copied' : 'Could not copy. Select the command and copy it by hand.'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallback()); });
  } else {
    done(fallback());
  }
}

// ---------- screens ----------
function screen(inner){ $('app').innerHTML = '<div class="center"><div class="card">' + inner + '</div></div>'; }
function showSignIn(msg){
  screen('<h2>Admin sign-in</h2><p class="muted">Sign in with Google to see sign-ups across every watched site.</p>'
    + '<button class="primary" id="btn-signin" type="button">Sign in with Google</button>'
    + (msg ? '<p class="note" style="color:var(--danger)">' + esc(msg) + '</p>' : ''));
  $('btn-signin').addEventListener('click', signIn);
}
function showNotOwner(email){
  screen('<h2>Owner only</h2><p class="muted">This console is owner-only.' + (email ? ' You are signed in as ' + esc(email) + '.' : '') + '</p>'
    + '<button type="button" id="btn-out">Sign out</button>');
  $('btn-out').addEventListener('click', signOut);
}
function showError(title, detail){
  screen('<h2>' + esc(title) + '</h2><p class="muted">' + esc(detail) + '</p>'
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"><button class="primary" type="button" id="btn-retry">Try again</button>'
    + '<button type="button" id="btn-out">Sign out</button></div>');
  $('btn-retry').addEventListener('click', refreshAll);
  $('btn-out').addEventListener('click', signOut);
}
function showEmpty(){
  screen('<h2>No data yet</h2><p class="muted">No data pushed yet - the watcher runs daily at 8:10.</p>'
    + '<button type="button" id="btn-out">Sign out</button>');
  $('btn-out').addEventListener('click', signOut);
}

// ---------- auth ----------
function signIn(){
  var p = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(p).catch(function(e){ showSignIn('Sign-in failed: ' + (e && e.message ? e.message : e)); });
}
function signOut(){ if(typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length) firebase.auth().signOut(); else location.reload(); }

// ---------- data ----------
function load(){
  if(!currentUser) return;
  screen('<p class="muted">Loading sign-ups...</p>');
  currentUser.getIdToken().then(function(tok){
    return fetch(WORKER + '/signupwatch', { headers: { Authorization: 'Bearer ' + tok } });
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(body){ return { status: r.status, body: body }; });
  }).then(function(res){
    if(res.status === 403) return showNotOwner(currentUser && currentUser.email);
    if(res.status === 401) return showError('Session not accepted', 'The server did not accept your sign-in. Sign out and back in, then try again.');
    if(res.status !== 200) return showError('Could not load sign-ups', 'The server answered ' + res.status + (res.body && res.body.error ? ': ' + res.body.error : '.'));
    if(!res.body || res.body.empty) return showEmpty();
    dash = res.body;
    render();
  }).catch(function(e){
    showError('Could not reach the server', 'The sign-ups service did not respond (' + (e && e.message ? e.message : e) + '). Check your connection and try again.');
  });
}
function refreshAll(){ load(); loadSettings(); }

// ---------- email alert settings ----------
function readRes(r){
  return r.json().catch(function(){ return {}; }).then(function(body){ return { status: r.status, body: body || {} }; });
}
function resReason(res){
  if(res.status === 403) return '403, this account is not the owner';
  if(res.status === 401) return '401, sign-in not accepted';
  return 'HTTP ' + res.status + (res.body && typeof res.body.error === 'string' && res.body.error ? ': ' + res.body.error : '');
}
function errReason(e){ return e && e.reason ? e.reason : (e && e.message ? e.message : String(e)); }
function normSettings(s){
  s = (s && typeof s === 'object') ? s : {};
  return { emailNewSignups: s.emailNewSignups === true, emailAnonymous: s.emailAnonymous === true, emailFailures: s.emailFailures === true };
}
function settingsReq(method, body){
  return currentUser.getIdToken().then(function(tok){
    var opts = { method: method, headers: { Authorization: 'Bearer ' + tok } };
    if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(WORKER + '/signupwatch/settings', opts);
  }).then(readRes).then(function(res){
    if(res.status !== 200 || !res.body.settings || typeof res.body.settings !== 'object') throw { reason: res.status === 200 ? 'unexpected response' : resReason(res) };
    return normSettings(res.body.settings);
  });
}
// Fetches only the settings; the dashboard is untouched. A newer call wins over an older one.
function loadSettings(){
  if(!currentUser) return;
  var my = ++alerts.seq;
  alerts.state = 'loading'; alerts.reason = ''; alerts.pending = {}; alerts.rowErr = {};
  renderAlerts();
  settingsReq('GET').then(function(s){
    if(my !== alerts.seq) return;
    alerts.settings = s; alerts.state = 'ready';
    renderAlerts();
  }).catch(function(e){
    if(my !== alerts.seq) return;
    alerts.state = 'error'; alerts.reason = errReason(e);
    renderAlerts();
  });
}
function alertVal(k){ return Object.prototype.hasOwnProperty.call(alerts.pending, k) ? alerts.pending[k] : !!(alerts.settings && alerts.settings[k]); }
function saveSetting(key, val, input){
  var hadFocus = document.activeElement === input;
  var body = {}; body[key] = val;
  alerts.pending[key] = val;
  syncAlertRows();
  settingsReq('POST', body).then(function(s){
    delete alerts.pending[key];
    delete alerts.rowErr[key];
    alerts.settings = s;
    syncAlertRows();
    toast('Saved. Applies from the next daily check (08:10).');
  }).catch(function(e){
    delete alerts.pending[key];
    alerts.rowErr[key] = 'Could not save (' + errReason(e) + '). Nothing changed.';
    syncAlertRows();
  }).then(function(){
    // Disabling a focused control drops focus in some browsers; hand it back.
    var a = document.activeElement;
    if(hadFocus && (!a || a === document.body) && document.body.contains(input)) input.focus();
  });
}

// ---------- render: email alerts ----------
// Full rebuild only on state changes (loading / error / ready). Saves go through
// syncAlertRows(), which updates the existing inputs so keyboard focus stays put.
function renderAlerts(){
  var el = $('alerts-card');
  if(!el) return;
  var head = '<h2>Email alerts</h2>';
  if(alerts.state === 'loading'){ el.innerHTML = head + '<p class="muted alerts-msg">Loading email settings...</p>'; return; }
  if(alerts.state === 'error'){
    el.innerHTML = head + '<p class="alerts-msg">Could not load email settings (' + esc(alerts.reason) + ').</p>'
      + '<button type="button" id="btn-alerts-retry">Try again</button>';
    $('btn-alerts-retry').addEventListener('click', loadSettings);
    return;
  }
  var to = dash && typeof dash.emailTo === 'string' && dash.emailTo ? dash.emailTo : '';
  var intro = (to ? 'Sent to ' + esc(to) + ' after each daily check (08:10).' : 'Sent after each daily check (08:10).')
    + ' Sign-ups always appear on this page, with or without the email.';
  el.innerHTML = head + '<p class="muted alerts-intro">' + intro + '</p><div class="arows">'
    + ALERT_ROWS.map(function(r){
      var k = r.key;
      return '<div class="arow"><label class="aswitch" id="alab-' + k + '"><span class="atext"><span class="aname" id="aname-' + k + '">' + esc(r.name) + '</span>'
        + '<span class="adesc" id="adesc-' + k + '"></span></span>'
        + '<span class="actl"><span class="astate" id="astate-' + k + '" aria-hidden="true"></span>'
        + '<input type="checkbox" role="switch" class="sw" id="asw-' + k + '" aria-labelledby="aname-' + k + '" aria-describedby="adesc-' + k + ' aerr-' + k + '"></span></label>'
        + '<p class="aerr" id="aerr-' + k + '" role="alert"></p></div>';
    }).join('') + '</div>';
  ALERT_ROWS.forEach(function(r){
    var input = $('asw-' + r.key);
    input.addEventListener('change', function(){ saveSetting(r.key, input.checked, input); });
  });
  syncAlertRows();
}
function syncAlertRows(){
  if(alerts.state !== 'ready') return;
  var busy = function(k){ return Object.prototype.hasOwnProperty.call(alerts.pending, k); };
  var signupsOn = alertVal('emailNewSignups');
  ALERT_ROWS.forEach(function(r){
    var k = r.key, input = $('asw-' + k);
    if(!input) return;
    var on = alertVal(k);
    var blocked = k === 'emailAnonymous' && (!signupsOn || busy('emailNewSignups'));
    input.checked = on;
    input.disabled = busy(k) || blocked;
    if(busy(k)) input.setAttribute('aria-busy', 'true'); else input.removeAttribute('aria-busy');
    $('alab-' + k).className = 'aswitch' + (blocked ? ' is-off' : '');
    var st = $('astate-' + k);
    st.textContent = on ? 'On' : 'Off';
    st.className = 'astate' + (on ? ' on' : '');
    $('adesc-' + k).textContent = k === 'emailAnonymous' && !signupsOn ? 'Turn on New sign-ups first.' : r.desc;
    $('aerr-' + k).textContent = alerts.rowErr[k] || '';
  });
}

// ---------- render: failing projects ----------
// Projects that share one cleaned error and one account collapse into one block.
function failingHtml(failing){
  var groups = [], byKey = Object.create(null);
  failing.forEach(function(p){
    var err = cleanErr(p.error) || 'unknown error';
    var acct = typeof p.account === 'string' ? p.account : '';
    var key = err + '\n' + acct;
    if(!byKey[key]){ byKey[key] = { err: err, acct: acct, list: [] }; groups.push(byKey[key]); }
    byKey[key].list.push(p);
  });
  return '<section class="card failing"><h2>Failing projects</h2><ul>' + groups.map(function(g){
    var projects = '<ul class="fprojects">' + g.list.map(function(p){
      return '<li><span class="pid">' + esc(p.projectId) + '</span> <span class="muted">' + esc(sitesStr(p)) + '</span>'
        + ' <span class="when">&middot; last OK ' + esc(relTime(p.lastOkAt)) + '</span></li>';
    }).join('') + '</ul>';
    if(!REAUTH_RE.test(g.err)) return '<li class="fgroup"><p class="err">' + esc(g.err) + '</p>' + projects + '</li>';
    var cmd = 'firebase login --reauth' + (g.acct ? ' --account ' + g.acct : '');
    return '<li class="fgroup"><p>The Firebase command-line login' + (g.acct ? ' for <strong>' + esc(g.acct) + '</strong>' : '')
      + ' expired, so these projects could not be checked.</p>' + projects
      + '<p class="muted">Run this in PowerShell on the PC that runs the watcher. The next daily check (08:10) picks it up.</p>'
      + '<div class="cmd"><code>' + esc(cmd) + '</code><button type="button" data-copy="' + esc(cmd) + '" aria-label="Copy command">Copy</button></div>'
      + '<p class="muted reported">Reported error: ' + esc(g.err) + '</p></li>';
  }).join('') + '</ul></section>';
}

// ---------- render ----------
function sortedProjects(list){
  var k = sort.key, mul = sort.dir === 'asc' ? 1 : -1;
  var val = function(p){
    if(k === 'sites') return sitesStr(p).toLowerCase();
    if(k === 'users') return typeof p.totalUsers === 'number' ? p.totalUsers : -1;
    if(k === 'status') return p.ok ? 1 : 0;
    if(k === 'last') return typeof p.lastOkAt === 'number' ? p.lastOkAt : 0;
    return 0;
  };
  return list.map(function(p, i){ return { p: p, i: i }; }).sort(function(a, b){
    var x = val(a.p), y = val(b.p);
    if(x < y) return -1 * mul;
    if(x > y) return 1 * mul;
    return a.i - b.i;
  }).map(function(o){ return o.p; });
}
function setSort(k){
  if(sort.key !== k || sort.isDefault) sort = { key: k, dir: 'asc', isDefault: false };
  else if(sort.dir === 'asc') sort = { key: k, dir: 'desc', isDefault: false };
  else sort = { key: DEFAULT_SORT.key, dir: DEFAULT_SORT.dir, isDefault: true };
  renderTable();
}
function th(k, label, tip){
  var on = sort.key === k;
  var aria = on ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  var arrow = on ? (sort.dir === 'asc' ? '&#9650;' : '&#9660;') : '';
  return '<th scope="col" aria-sort="' + aria + '"><button type="button" data-sort="' + k + '" title="' + esc(tip) + '">'
    + esc(label) + '<span class="arrow" aria-hidden="true">' + arrow + '</span></button></th>';
}
// Date + time + relative age, or "not recorded" when Firebase recorded nothing (null / 0).
function userWhen(ms){
  if(typeof ms !== 'number' || !isFinite(ms) || ms <= 0) return '<span class="muted">not recorded</span>';
  return esc(fmtFull(ms)) + ' <span class="muted">(' + esc(relTime(ms)) + ')</span>';
}
// Every string here comes from someone's sign-up, so all of it goes through esc().
function rosterHtml(p){
  var users = p.users;
  if(!users.length) return '<p class="muted rnote">No users yet.</p>';
  var items = users.map(function(u){
    u = (u && typeof u === 'object') ? u : {};
    var chips = (u.anonymous === true ? '<span class="chip" title="Signed in without an email (Firebase anonymous auth)">anonymous</span>' : '')
      + (u.owner === true ? '<span class="chip" title="Your own account (on the watcher\'s allowlist)">you</span>' : '');
    return '<li><div class="rwho"><span class="rname">' + esc(u.name || '(no name)') + '</span>' + chips
      + (u.email ? '<span class="remail">' + esc(u.email) + '</span>' : '') + '</div>'
      + '<div class="rwhen"><span class="rlbl">Signed up</span><span>' + userWhen(u.createdAt) + '</span></div>'
      + '<div class="rwhen"><span class="rlbl" title="' + esc(LAST_SIGNIN_TIP) + '">Last sign-in</span><span>' + userWhen(u.lastLoginAt) + '</span></div></li>';
  }).join('');
  var foot = p.usersTruncated === true
    ? '<p class="muted rnote">Showing newest ' + esc(users.length) + (typeof p.totalUsers === 'number' ? ' of ' + esc(p.totalUsers) : '') + '.</p>'
    : '';
  return '<ul class="roster">' + items + '</ul>' + foot;
}
function usersCell(p, idx){
  if(typeof p.totalUsers !== 'number') return '<span class="muted" title="Not counted: this project failed to export on the last run">-</span>';
  // Payload from watcher 0.2.x (no roster yet): plain count, as before.
  if(!Array.isArray(p.users)) return '<span title="' + esc(NO_ROSTER_TIP) + '">' + esc(p.totalUsers) + '</span>';
  var open = !!openRows[p.projectId];
  return '<button type="button" class="ubtn" data-ux="' + idx + '" aria-expanded="' + open + '" aria-controls="ux-' + idx + '"'
    + ' aria-label="' + esc(p.totalUsers + ' users in ' + sitesStr(p) + ', show list') + '" title="Show who signed up, newest first">'
    + '<span class="chev" aria-hidden="true">&#9656;</span>' + esc(p.totalUsers) + '</button>';
}
function renderTable(){
  var projects = Array.isArray(dash.projects) ? dash.projects : [];
  var rows = sortedProjects(projects).map(function(p){
    var idx = projects.indexOf(p);
    var hasRoster = typeof p.totalUsers === 'number' && Array.isArray(p.users);
    return '<tr>'
      + '<td data-label="Site(s)">' + esc(sitesStr(p)) + '<span class="pidsub">' + esc(p.projectId) + '</span></td>'
      + '<td data-label="Users" class="num">' + usersCell(p, idx) + '</td>'
      + '<td data-label="Status">' + (p.ok ? '<span class="status ok">OK</span>' : '<span class="status fail" title="' + esc(cleanErr(p.error)) + '">FAILED</span>') + '</td>'
      + '<td data-label="Last checked"><span title="' + esc(fmtFull(p.lastOkAt) || 'No successful export recorded yet') + '">' + esc(relTime(p.lastOkAt)) + '</span></td>'
      + '</tr>'
      + (hasRoster ? '<tr class="xrow" id="ux-' + idx + '"' + (openRows[p.projectId] ? '' : ' hidden') + '><td colspan="4">'
        + '<div class="roster-box">' + rosterHtml(p) + '</div></td></tr>' : '');
  }).join('');
  var opts = [['users-desc','Users, most first'],['users-asc','Users, fewest first'],['sites-asc','Site A-Z'],['sites-desc','Site Z-A'],['status-asc','Failing first'],['last-desc','Checked most recently'],['last-asc','Checked longest ago']];
  var cur = sort.key + '-' + sort.dir;
  $('proj-card').innerHTML = '<div class="tbl-head"><h2>Projects</h2>'
    + (sort.isDefault ? '' : '<button type="button" id="btn-sort-reset" title="Back to the default order: most users first">Reset sort</button>')
    + '<label class="sort-ctl mobile-only"><span class="muted">Sort</span><select id="sort-sel">'
    + opts.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('')
    + '</select></label></div>'
    + '<table><colgroup><col class="c-sites"><col class="c-users"><col class="c-status"><col class="c-last"></colgroup><thead><tr>'
    + th('sites', 'Site(s)', 'Sites sharing this Firebase project; the project id is underneath')
    + th('users', 'Users', 'Firebase Auth accounts in this project, owner accounts included')
    + th('status', 'Status', 'Whether the last run could export this project\'s users')
    + th('last', 'Last checked', 'When this project last exported successfully')
    + '</tr></thead><tbody>' + (rows || '<tr><td colspan="4" class="muted">No projects in the last push.</td></tr>') + '</tbody></table>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'), function(b){
    b.addEventListener('click', function(){ setSort(b.getAttribute('data-sort')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ux]'), function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-ux');
      var row = $('ux-' + i), p = projects[i];
      if(!row || !p) return;
      var opening = row.hidden;
      row.hidden = !opening;
      b.setAttribute('aria-expanded', String(opening));
      if(opening) openRows[p.projectId] = 1; else delete openRows[p.projectId];
    });
  });
  var rb = $('btn-sort-reset');
  if(rb) rb.addEventListener('click', function(){ sort = { key: DEFAULT_SORT.key, dir: DEFAULT_SORT.dir, isDefault: true }; renderTable(); });
  $('sort-sel').addEventListener('change', function(e){
    var parts = e.target.value.split('-');
    var isDef = parts[0] === DEFAULT_SORT.key && parts[1] === DEFAULT_SORT.dir;
    sort = { key: parts[0], dir: parts[1], isDefault: isDef };
    renderTable();
  });
}
function render(){
  var projects = Array.isArray(dash.projects) ? dash.projects : [];
  var events = Array.isArray(dash.events) ? dash.events : [];
  var totals = dash.totals || {};
  var now = Date.now();
  var weekNew = events.filter(function(e){ return typeof e.firstSeenAt === 'number' && now - e.firstSeenAt <= 7 * DAY; }).length;
  var siteSet = {};
  projects.forEach(function(p){ (Array.isArray(p.sites) ? p.sites : [p.projectId]).forEach(function(s){ siteSet[s] = 1; }); });
  var failing = projects.filter(function(p){ return !p.ok; });

  var tile = function(label, tip, value, bad){
    return '<div class="tile' + (bad ? ' bad' : '') + '"><div class="lbl" title="' + esc(tip) + '">' + esc(label) + '</div><div class="num">' + esc(value) + '</div></div>';
  };
  var eventsHtml = events.length ? '<ul class="events">' + events.map(function(e){
    var who = esc(e.name || '(no name)') + (e.anonymous ? ' <span class="chip" title="Signed in without an email (Firebase anonymous auth)">anonymous</span>' : ' &lt;' + esc(e.email) + '&gt;');
    return '<li><span class="site">' + esc((Array.isArray(e.sites) ? e.sites : [e.projectId]).join(' / ')) + '</span><span class="sep" aria-hidden="true">&middot;</span>' + who
      + '<div class="when"><span title="' + esc(fmtFull(e.createdAt) || 'Firebase did not record a creation time') + '">signed up ' + esc(fmtDate(e.createdAt)) + '</span>'
      + ' &middot; <span title="' + esc('First seen by the watcher ' + fmtFull(e.firstSeenAt)) + '">spotted ' + esc(relTime(e.firstSeenAt)) + '</span></div></li>';
  }).join('') + '</ul>' : '<p class="muted" style="margin:0">No sign-ups recorded yet - that\'s a quiet, healthy fleet.</p>';

  $('app').innerHTML = '<header class="hdr"><div><h1>Sign-ups</h1>'
    + '<div class="updated muted"><span title="' + esc('Watcher run finished ' + fmtFull(dash.generatedAt)) + '">Updated ' + esc(relTime(dash.generatedAt)) + '</span></div></div>'
    + '<div class="who"><span class="muted" style="font-size:13px">' + esc(currentUser && currentUser.email) + '</span>'
    + '<button type="button" id="btn-refresh" title="Fetch the latest pushed snapshot">Refresh</button>'
    + '<button type="button" id="btn-out">Sign out</button></div></header>'
    + '<section class="tiles" aria-label="Summary">'
    + tile('Total accounts', 'Firebase Auth accounts across projects that exported OK on the last run, owner accounts included', typeof totals.totalUsers === 'number' ? totals.totalUsers : '-')
    + tile('New this week', 'Sign-ups the watcher first spotted in the last 7 days (owner accounts never count)', weekNew)
    + tile('Sites watched', 'Distinct sites across every watched Firebase project (several sites can share one project)', Object.keys(siteSet).length)
    + tile('Projects failing', 'Projects whose user export failed on the last run, so new sign-ups there could be missed', failing.length, failing.length > 0)
    + '</section>'
    + (failing.length ? failingHtml(failing) : '')
    + '<div class="layout"><section class="card" id="proj-card"></section><div class="aside">'
    + '<section class="card"><h2 title="Newest first; owner accounts are never listed">Recent sign-ups</h2>' + eventsHtml + '</section>'
    + '<section class="card" id="alerts-card"></section></div></div>'
    + '<p class="note muted">Sign-ups v' + VERSION + (dash.version ? ' &middot; watcher v' + esc(dash.version) : '') + '</p>';
  renderTable();
  renderAlerts();
  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function(b){
    b.addEventListener('click', function(){ copyText(b.getAttribute('data-copy')); });
  });
  $('btn-out').addEventListener('click', signOut);
  $('btn-refresh').addEventListener('click', refreshAll);
}

// ---------- boot ----------
document.addEventListener('DOMContentLoaded', function(){
  if(typeof firebase === 'undefined'){ showError('Could not load sign-in', 'The Google sign-in library did not load. Check your connection and reload the page.'); return; }
  try { firebase.initializeApp(FIREBASE_CONFIG); }
  catch(e){ showError('Could not start sign-in', String(e && e.message ? e.message : e)); return; }
  firebase.auth().onAuthStateChanged(function(user){
    currentUser = user; dash = null;
    alerts = { state: 'loading', reason: '', settings: null, pending: {}, rowErr: {}, seq: alerts.seq + 1 };
    if(!user) return showSignIn();
    if((user.email || '').toLowerCase() !== OWNER_EMAIL) return showNotOwner(user.email);
    refreshAll();
  });
});
</script>

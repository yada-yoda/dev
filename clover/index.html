<!-- Google Analytics (GA4). Owner devices opt out via ?ga=off (persists per
     device); the official ga-disable flag also blocks the script from loading. -->
<script>
(function () {
  var GA_ID = 'G-HVDJ7VNR9W';
  try {
    var p = new URLSearchParams(location.search);
    if (p.get('ga') === 'off') localStorage.setItem('clover_ga_optout', '1');
    if (p.get('ga') === 'on')  localStorage.removeItem('clover_ga_optout');
  } catch (e) {}
  var optedOut = false;
  try { optedOut = localStorage.getItem('clover_ga_optout') === '1'; } catch (e) {}
  window['ga-disable-' + GA_ID] = optedOut;
  if (optedOut) return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', GA_ID);
})();
</script>

<!-- ============ Sign-in gate (logged out) ============ -->
<div id="signin-gate" class="hidden">
  <div class="gate-card">
    <svg class="gate-logo" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 26 Q14.5 20 11 17" fill="none" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="#16a34a">
        <path d="M16 16 C 9.5 11.5, 11 4, 16 8 C 21 4, 22.5 11.5, 16 16 Z"/>
        <path d="M16 16 C 20.5 9.5, 28 11, 24 16 C 28 21, 20.5 22.5, 16 16 Z"/>
        <path d="M16 16 C 22.5 20.5, 21 28, 16 24 C 11 28, 9.5 20.5, 16 16 Z"/>
        <path d="M16 16 C 11.5 22.5, 4 21, 8 16 C 4 11, 11.5 9.5, 16 16 Z"/>
      </g>
    </svg>
    <h1>Clover</h1>
    <p class="gate-tagline">Your money, all in one place.</p>
    <button id="btn-signin" class="btn-google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5h-1.9V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.1 36.3 44 30.7 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Sign in with Google
    </button>
    <p class="gate-error hidden" id="gate-error"></p>
    <p class="gate-foot">Private &amp; single-user. Data is never public. · <a href="privacy.html">Privacy, terms &amp; disclaimer</a></p>
  </div>
</div>

<!-- ============ App shell (logged in) ============ -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 26 Q14.5 20 11 17" fill="none" stroke="#15803d" stroke-width="1.6" stroke-linecap="round"/>
        <g fill="#16a34a">
          <path d="M16 16 C 9.5 11.5, 11 4, 16 8 C 21 4, 22.5 11.5, 16 16 Z"/>
          <path d="M16 16 C 20.5 9.5, 28 11, 24 16 C 28 21, 20.5 22.5, 16 16 Z"/>
          <path d="M16 16 C 22.5 20.5, 21 28, 16 24 C 11 28, 9.5 20.5, 16 16 Z"/>
          <path d="M16 16 C 11.5 22.5, 4 21, 8 16 C 4 11, 11.5 9.5, 16 16 Z"/>
        </g>
      </svg>
      Clover
    </div>
    <nav class="nav" id="nav"><!-- built by app.js --></nav>
    <div class="sidebar-foot">v<span id="ver"></span></div>
  </aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <h2 id="view-title">Dashboard</h2>
      <div class="spacer"></div>
      <div class="period-select">
        <select id="sel-year" aria-label="Year"></select>
        <select id="sel-month" aria-label="Month"></select>
      </div>
      <div class="search"><input id="search" type="search" placeholder="Search…" aria-label="Search"></div>
      <div class="user-chip">
        <img id="user-avatar" alt="" src="">
        <span class="uname" id="user-name"></span>
        <button class="btn-ghost" id="btn-signout">Sign out</button>
      </div>
    </header>
    <main class="view" id="view"><!-- rendered by app.js --></main>
  </div>
</div>

<!-- Shared modal + toast hosts -->
<div class="modal-host hidden" id="modal-host">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-x" id="modal-x" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-confirm">Save</button>
    </div>
  </div>
</div>
<div class="toast-host" id="toast-host"></div>

     fresh JS after a deploy. Keep in step with VERSION in app.js. -->

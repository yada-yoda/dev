<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 &mdash; Not Found</title>
<meta name="robots" content="noindex, nofollow">
<!-- GH Pages always serves THIS file for any not-found URL across the
     whole dev.rizzo.cc domain. Inline JS below detects the requested path
     and bounces to the project-specific 404 page when appropriate, so each
     project gets its own branded not-found experience. -->
<script>
  (function(){
    var p = window.location.pathname;
    if (p.indexOf('/404') !== -1) return;       // already on a 404 page; don't loop
    if (p.indexOf('/acting/') === 0) { window.location.replace('/acting/404.html'); return; }
    if (p.indexOf('/usage/')  === 0) { window.location.replace('/usage/404.html');  return; }
    if (p.indexOf('/clover/') === 0) { window.location.replace('/clover/404.html'); return; }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#2c2e3d;
    color:#f2f2f2;
    font-family:'Montserrat',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:radial-gradient(1200px 600px at 50% 30%, rgba(0,188,212,.08), transparent 60%), #2c2e3d;
  }
  .wrap{max-width:520px}
  .code{
    font-size:clamp(120px,22vw,220px);
    font-weight:900;letter-spacing:-.04em;line-height:.9;
    color:#00bcd4;
    text-shadow:0 8px 40px rgba(0,188,212,.25);
    margin-bottom:14px;
  }
  .msg{
    font-size:clamp(15px,1.8vw,18px);
    font-weight:300;letter-spacing:.06em;
    color:#cfd3dd;
  }
  .foot{
    position:fixed;bottom:18px;left:0;right:0;text-align:center;
    font-size:10px;letter-spacing:.32em;text-transform:uppercase;
    color:#5b5d6e;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <p class="msg">Nothing lives at this path. Yet.</p>
  </div>
  <div class="foot">dev.rizzo.cc</div>
</body>
</html>

function setTargetCalendar(id){ data.settings.gcalCalendarId = id; gcalChoosing = false; save(); syncToGoogleCalendar(); }
async function syncToGoogleCalendar(){
  if(!gcalAccessToken){ connectGoogleCalendar(); return; }
  const calId = data.settings.gcalCalendarId || 'primary';
  const events = calendarEvents().filter(e => !e.local); // journal entries stay in-app only
  if(!events.length){ showToast('No dated events to sync yet'); return; }
  showToast('⏳ Syncing to Google Calendar…');
  let ok = 0, fail = 0;
  data.gcalEvents = data.gcalEvents || {};
  for(const e of events){
    const tz = appTimezone();
    let body;
    if(e.time){
      // Timed event: 1-hour block at the given time.
      const startISO = e.date + 'T' + (e.time.length===5 ? e.time+':00' : e.time);
      const endDt = new Date(new Date(startISO).getTime() + 60*60000);
      const endISO = `${endDt.getFullYear()}-${pad(endDt.getMonth()+1)}-${pad(endDt.getDate())}T${pad(endDt.getHours())}:${pad(endDt.getMinutes())}:00`;
      body = { summary:e.title, description:(e.desc||'')+'\n\n— via PawPrints', start:{ dateTime:startISO, timeZone:tz }, end:{ dateTime:endISO, timeZone:tz } };
    } else {
      body = { summary:e.title, description:(e.desc||'')+'\n\n— via PawPrints', start:{ date:e.date }, end:{ date:e.date }, transparency:'transparent' };
    }
    if(e.location) body.location = e.location;
    const existing = data.gcalEvents[e.key];
    try {
      let r;
      if(existing){ r = await gcalFetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calId)+'/events/'+encodeURIComponent(existing), { method:'PATCH', body:JSON.stringify(body) }); if(r.status===404){ r = null; } }
      if(!existing || (existing && !r)){ r = await gcalFetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calId)+'/events', { method:'POST', body:JSON.stringify(body) }); }
      if(r && r.ok){ const j = await r.json(); data.gcalEvents[e.key] = j.id; ok++; } else fail++;
    } catch(err){ if(err.message==='auth-expired'){ showToast('⚠️ Session expired — reconnect Google Calendar'); render(); return; } fail++; }
    await new Promise(r=>setTimeout(r,150));
  }
  save();
  showToast('✅ Synced '+ok+' event'+(ok===1?'':'s')+' to Google Calendar'+(fail?' ('+fail+' failed)':''));
}

    +'<div class="grid-2"><div><label class="label">Date</label><input class="input" type="date" id="ev-date" value="'+(e?esc(e.date||''):todayISO())+'"></div>'
    +'<div><label class="label">Time (optional)'+tip('Leave blank for an all-day reminder. If set, the calendar event is a timed 1-hour block.')+'</label><input class="input" type="time" id="ev-time" value="'+(e?esc(e.time||''):'')+'"></div></div>'
    +'<label class="label">Location (optional)</label><input class="input" id="ev-loc" value="'+(e?esc(e.location||''):'')+'" placeholder="Address or place">'
    +'<label class="label">Notes</label><textarea class="textarea" id="ev-notes" rows="2">'+(e?esc(e.notes||''):'')+'</textarea>'
    +'<p style="font-size:11px;color:var(--text-secondary);margin:2px 0 12px">Shows on the calendar and, if Google Calendar is connected, is added there on save.</p>'
    +'<div style="display:flex;gap:10px"><button class="btn-primary" onclick="saveEvent('+(e?"'"+e.id+"'":'null')+')">Save</button>'
    +(e?'<button class="btn btn-danger" onclick="deleteEvent(\''+e.id+'\')">Delete</button>':'')
    +'<button class="btn" onclick="closeModal()">Cancel</button></div>');
}
function saveEvent(id){
  if(denyManage()) return;
  draftCommit();
  if(!activePet()){ promptAddDog(); return; }
  const title = fv('ev-title'); if(!title){ showToast('⚠️ Enter a title'); return; }
  const f = { title:title, date:fv('ev-date'), time:fv('ev-time'), location:fv('ev-loc'), notes:fv('ev-notes'), evtype:fv('ev-type')||'General' };
  data.customEvents = data.customEvents || [];
  let eid = id;
  if(id){ data.customEvents = data.customEvents.map(x => x.id===id ? {...x, ...f} : x); }
  else { eid = genId(); data.customEvents.unshift({ id:eid, petId:data.activePetId, ...f }); }
  logChange(id?'edited':'added','reminder', title+' · '+fmtDate(f.date));
  closeModal(); save(); showToast('📌 Reminder saved');
  if(gcalAccessToken) syncToGoogleCalendar(); // push it (and anything else pending) to Google Calendar
}
function deleteEvent(id){
  if(denyManage()) return;
  const e = (data.customEvents||[]).find(x=>x.id===id);
  data.customEvents = (data.customEvents||[]).filter(x=>x.id!==id);
  markDeleted(id);
  if(e) logChange('deleted','reminder', e.title||'');
  closeModal(); save(); showToast('🗑️ Deleted');
}
// .ics export fallback (no Google account needed)
function exportICS(){
  const events = calendarEvents().filter(e => !e.local); // journal entries stay in-app only
  if(!events.length){ showToast('No dated events to export'); return; }
  const stamp = (s)=> (s||todayISO()).replace(/-/g,'');
  const dtstart = (e) => {
    if(e.time){ const hm = (e.time.length===5 ? e.time+':00' : e.time).replace(/:/g,''); return 'DTSTART:'+stamp(e.date)+'T'+hm; }
    return 'DTSTART;VALUE=DATE:'+stamp(e.date);
  };
  const body = events.map(e => 'BEGIN:VEVENT\r\nUID:'+e.key.replace(/[^a-z0-9]/gi,'')+'@pawprints\r\n'+dtstart(e)+'\r\nSUMMARY:'+(e.title.replace(/[\n,;]/g,' '))+'\r\nDESCRIPTION:'+((e.desc||'').replace(/\r?\n/g,'\\n'))+'\r\nEND:VEVENT').join('\r\n');
  dl(new Blob(['BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PawPrints//EN\r\nCALSCALE:GREGORIAN\r\n'+body+'\r\nEND:VCALENDAR'],{type:'text/calendar'}), safeName(activePet()?activePet().name:'pawprints')+'-schedule.ics');
  showToast('📅 .ics downloaded');
}

// REMINDERS
// ═══════════════════════════════════════════════
function getReminders(){
  const out = [];
  const todayK = todayISO();
  petArr('meds').forEach(m => { const nd = medNextDue(m); if(nd){ const u = untilStr(nd); if(u && u.days <= 7) out.push({ icon:'💊', text:m.name+' '+(u.past?'overdue ('+u.text+')':'due '+u.text), over:u.past, sort:u.days }); } });
  petArr('vetVisits').forEach(v => {
    if(v.date && v.date > todayK){ const u = untilStr(v.date); if(u && u.days <= 30) out.push({ icon:'🏥', text:'Vet visit '+u.text+(v.reason?' · '+v.reason:''), over:false, sort:u.days }); }
    if(v.followUpDate){ const u = untilStr(v.followUpDate); if(u && !u.past && u.days <= 30) out.push({ icon:'🏥', text:'Vet follow-up '+u.text+(v.reason?' · '+v.reason:''), over:false, sort:u.days }); }
  });
  petArr('grooming').forEach(g => {
    if(g.date && g.date > todayK){ const u = untilStr(g.date); if(u && u.days <= 30) out.push({ icon:'✂️', text:'Grooming '+u.text+(g.services&&g.services.length?' · '+g.services.join(', '):''), over:false, sort:u.days }); }
    if(g.nextDueDate){ const u = untilStr(g.nextDueDate); if(u && u.days <= 14) out.push({ icon:'✂️', text:'Grooming '+(u.past?'overdue ('+u.text+')':'due '+u.text), over:u.past, sort:u.days }); }
  });
  petArr('records').forEach(r => { if(r.nextDue){ const u = untilStr(r.nextDue); if(u && u.days <= 30) out.push({ icon:'📋', text:(r.name||r.type||'Record')+' '+(u.past?'due again ('+u.text+')':'due again '+u.text), over:u.past, sort:u.days }); } });
  petArr('inventory').filter(i=>i.runningLow).forEach(i => out.push({ icon:'🛒', text:'Restock '+(i.brand?i.brand+' ':'')+i.name, over:false, sort:99 }));
  // Fresh-water reminder — nag when the bowl hasn't been refilled within the chosen window.
  const wMode = (data.settings && data.settings.waterReminderMode) || 'overall';
  if(wMode !== 'off'){
    const hrs = Math.max(1, num(data.settings && data.settings.waterReminderHours) || 24);
    const staleMs = hrs*3600000;
    const agoStr = ms => { const h = Math.floor(ms/3600000); return h>=24 ? (Math.floor(h/24)+'d '+(h%24)+'h') : (h+'h'); };
    const waters = petLogs('water').filter(l=>l.dateTime).sort((a,b)=>new Date(b.dateTime)-new Date(a.dateTime));
    const snooze = (data.settings && data.settings.waterSnooze) || {};
    const muted = ((data.settings && data.settings.waterMutedBowls) || []).map(x=>x.toLowerCase());
    const snoozed = key => (snooze[key]||0) > Date.now();
    const waterActs = (key, canMute) =>
      '<button class="btn btn-sm" onclick="event.stopPropagation();snoozeWater(\''+encArg(key)+'\')" title="Hide this reminder for one reminder window">💤</button>'
      + (canMute ? ' <button class="btn btn-sm" onclick="event.stopPropagation();muteWaterBowl(\''+encArg(key)+'\')" title="Stop watching this bowl — re-enable any time in Settings">🔕</button>' : '');
    if(wMode === 'perLocation'){
      const seen = {}; waters.forEach(w=>{ const p=(w.place||'').trim()||'the bowl'; if(!(p in seen)) seen[p]=w; });
      Object.keys(seen).forEach(p=>{
        if(muted.includes(p.toLowerCase()) || snoozed(p)) return;
        const age = Date.now()-new Date(seen[p].dateTime).getTime();
        if(age>=staleMs) out.push({ icon:'💧', text:'Fresh water — '+p+' last refilled '+agoStr(age)+' ago', over:true, sort:-(age/staleMs), act:waterActs(p, true) });
      });
    } else if(waters.length && !snoozed('_overall')){
      const age = Date.now()-new Date(waters[0].dateTime).getTime();
      if(age>=staleMs){ const p=(waters[0].place||'').trim(); out.push({ icon:'💧', text:'Fresh water needed — last refilled '+agoStr(age)+' ago'+(p?' ('+p+')':''), over:true, sort:-(age/staleMs), act:waterActs('_overall', false) }); }
    }
  }
  return out.sort((a,b)=>a.sort-b.sort);
}

// ── Google Analytics (anonymous pageviews + per-tab virtual pageviews) ──
const NAV_LABEL = { today:'Today', log:'Log', profile:'Profile', care:'Care', calendar:'Calendar', supplies:'Supplies', insights:'Insights', history:'Activity history', activity:'Activity' };
let analyticsOn = false;
function initAnalytics(){
  if(!GA_ID || analyticsOn) return;
  const q = new URLSearchParams(location.search);
  // Per-device opt-out: visit with ?noga=1 to never count this browser again (?noga=0 re-enables).
  if(q.has('noga')){
    try {
      if(q.get('noga') === '0'){ localStorage.removeItem('pawprints_noga'); showToast('📊 Analytics re-enabled on this device'); }
      else { localStorage.setItem('pawprints_noga','1'); showToast('🚫 Your visits won’t be counted on this device'); }
    } catch(e){}
  }
  if(localStorage.getItem('pawprints_noga') === '1') return; // opted out on this browser
  if(q.has('demo')) return; // never track the demo
  const s = document.createElement('script');
  s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', GA_ID, { anonymize_ip:true, send_page_view:false });
  analyticsOn = true;
  trackView(currentView || 'today');
}
function trackView(v){
  if(!analyticsOn || typeof gtag === 'undefined') return;
  gtag('event', 'page_view', {
    page_title: 'PawPrints — ' + (NAV_LABEL[v] || v),
    page_location: location.origin + location.pathname + '#' + v,
    page_path: location.pathname + '#' + v
  });
}
function switchView(v){
  if(v==='settings' && currentView!=='settings') settingsReturnView = currentView;
  currentView = v;
  VIEWS.forEach(id => document.getElementById('view-'+id).classList.toggle('hidden', id!==v));
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.view===v));
  trackView(v);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  // No dog yet → a feature tab can't do anything useful. Prompt to add one. (Settings/history are fine.)
  if(!activePet() && v !== 'today' && v !== 'history' && v !== 'settings') promptAddDog();
}

const SUP_SORTS = [{k:'name',l:'Item',t:'text'},{k:'brand',l:'Brand',t:'text'},{k:'store',l:'Where',t:'text'},{k:'category',l:'Category',t:'text'},{k:'cost',l:'Cost',t:'num'},{k:'purchaseDate',l:'Purchased',t:'date'},{k:'status',l:'Status',t:'status'}];
function setSuppliesSort(key){
  if(suppliesSort.key===key){ suppliesSort.dir = suppliesSort.dir==='asc'?'desc':'asc'; }
  else { const s = SUP_SORTS.find(x=>x.k===key); suppliesSort = { key, dir:(s && (s.t==='num'||s.t==='date'))?'desc':'asc' }; }

const SUP_STATUS_RANK = { 'In use':0, 'Inventory':1, 'One-time':2, 'Finished':3 };
function suppliesCompare(a, b){
  const s = SUP_SORTS.find(x=>x.k===suppliesSort.key) || SUP_SORTS[5];
  let av, bv, r;
  if(s.t==='num'){ av=num(a.cost)||0; bv=num(b.cost)||0; r=av-bv; }
  else if(s.t==='status'){ av=SUP_STATUS_RANK[invStatus(a)]??9; bv=SUP_STATUS_RANK[invStatus(b)]??9; r=av-bv; }
  else { av=(a[s.k]||'').toString().toLowerCase(); bv=(b[s.k]||'').toString().toLowerCase(); r=av.localeCompare(bv); }
  if(r===0) r=(b.purchaseDate||'').localeCompare(a.purchaseDate||''); // tiebreak: newest purchase first
  return suppliesSort.dir==='asc' ? r : -r;
}

// ── TODAY ──
// "Last potty" split into pee / poop halves — they run on different clocks (a dog pees far
// more often than it poops), so one combined time hides which need is actually due.
// Each half gets its own overdue highlight; when BOTH are overdue, the one further past its
// own threshold (relative severity, not raw hours) glows stronger.
function pottySplitCard(){
  const desc = (a,b)=>new Date(b.dateTime)-new Date(a.dateTime);
  const pee = petLogs('potty').filter(l=>l.dateTime && (l.result==='Pee'||l.result==='Both')).sort(desc)[0] || null;
  const poop = petLogs('potty').filter(l=>l.dateTime && (l.result==='Poop'||l.result==='Both'||!!(l.stool&&String(l.stool).trim()))).sort(desc)[0] || null;
  const ratio = (l, hrs) => l ? (Date.now()-new Date(l.dateTime).getTime())/(hrs*3600000) : 0;
  const rPee = ratio(pee, 8), rPoop = ratio(poop, 24);
  const overPee = rPee > 1, overPoop = rPoop > 1, both = overPee && overPoop;
  const strongPee = both && rPee >= rPoop, strongPoop = both && rPoop > rPee;
  const half = (emoji, label, l, over, strong) => {
    const box = over ? (strong ? 'background:rgba(248,81,73,.22);border:1px solid rgba(248,81,73,.8)' : 'background:rgba(248,81,73,.09);border:1px solid rgba(248,81,73,.4)') : 'border:1px solid transparent';
    return '<div style="min-width:0;padding:5px 7px;border-radius:8px;'+box+'"'+(over?' title="'+label+' overdue'+(strong?' — overdue the longest':'')+'"':'')+'>'
      + '<div style="font-size:11px;color:'+(over?'var(--danger)':'var(--text-secondary)')+'">'+emoji+' '+label+'</div>'
      + '<div class="sc-val" style="font-size:14px;margin-top:2px;'+(strong?'font-weight:800;':'')+'color:'+(!l?'var(--text-secondary)':over?'var(--danger)':'var(--text-primary)')+'">'+(l?timeAgo(l.dateTime).replace(' ago',''):'—')+'</div>'
      + '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">'+(l?fmtTime(l.dateTime):'not logged')+'</div></div>';
  };
  return '<div class="status-card'+((overPee||overPoop||(!pee&&!poop))?' overdue':'')+'"><div class="sc-label">'+svgIcon('potty',16)+' Last potty</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px">'+half('💧','Pee',pee,overPee,strongPee)+half('💩','Poop',poop,overPoop,strongPoop)+'</div></div>';
}
function statusCard(label, icon, dt, overdueHrs, extra){
  const ago = timeAgo(dt);
  const over = dt && overdueHrs && (Date.now()-new Date(dt).getTime()) > overdueHrs*3600000;
  const none = !dt;
  return '<div class="status-card'+(over||none?' overdue':'')+'"><div class="sc-label">'+icon+' '+label+'</div><div class="sc-val" style="color:'+(none?'var(--text-secondary)':over?'var(--danger)':'var(--text-primary)')+'">'+(ago||'—')+'</div>'
    +(dt?'<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">'+fmtTime(dt)+'</div>':'<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">not logged</div>')
    +(extra||'')+'</div>';
}
// "Fed today vs goal" as its own card (sits side-by-side with the next-badge card on Today).
function renderFeedingCard(){
  const todayKey = todayISO();
  const amt = petLogs('feed').filter(f => f.dateTime && f.dateTime.slice(0,10)===todayKey).reduce((s,f)=> s + (num(f.amount)||0), 0);
  const goal = num((data.settings||{}).feedGoal), unit = ((data.settings||{}).feedGoalUnit || 'cups');
  if(amt<=0 && !(goal && goal>0)) return '';
  const fmt = n => (Math.round(n*100)/100).toString();
  const goalTip = tip('Set a daily feeding goal in Settings → Lists & preferences to track progress toward it here.');
  const head = '<span style="font-size:12px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:5px">'+svgIcon('fed',14)+' Fed today'+goalTip+'</span>';
  let body;
  if(goal && goal>0){
    const pct = Math.min(100, Math.round(amt/goal*100)), met = amt >= goal;
    body = '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+head+'<span style="font-family:\'JetBrains Mono\',monospace;font-weight:700;font-size:16px;color:'+(met?'var(--success)':'var(--text-primary)')+'">'+fmt(amt)+' / '+fmt(goal)+' '+esc(unit)+(met?' ✓':'')+'</span></div>'
      + '<div style="height:9px;background:var(--bg-tertiary);border-radius:5px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(met?'var(--success)':'linear-gradient(90deg,var(--accent),var(--accent-2))')+';border-radius:5px;transition:width .3s"></div></div>';
  } else {
    body = '<div style="display:flex;justify-content:space-between;align-items:baseline">'+head+'<span style="font-family:\'JetBrains Mono\',monospace;font-weight:700;font-size:16px">'+fmt(amt)+' '+esc(unit)+'</span></div>';
  }
  return '<div class="card" style="margin-bottom:0;display:flex;flex-direction:column;justify-content:center">'+body+'</div>';
}
// ── On this day — journal flashbacks from exactly N months / years ago today ──
function renderOnThisDay(){
  const entries = petArr('journal').filter(n=>n.dateTime);
  if(!entries.length) return '';
  const now = new Date(), ty = now.getFullYear(), tm = now.getMonth(), td = now.getDate();
  const hits = [];
  entries.forEach(n => {
    const d = new Date(n.dateTime); if(isNaN(d) || d.getDate() !== td) return;
    const months = (ty - d.getFullYear())*12 + (tm - d.getMonth());
    if(months <= 0) return;
    const label = months % 12 === 0 ? ((months/12)+' year'+(months===12?'':'s')+' ago today') : (months+' month'+(months===1?'':'s')+' ago today');
    hits.push({ n, months, label });
  });
  if(!hits.length) return '';
  hits.sort((a,b)=>a.months-b.months);
  return '<div class="card"><h3 class="section-title">📅 On this day</h3>' + hits.map(h => {
    const k = journalKind(h.n), km = JOURNAL_KINDS[k];
    return '<div class="entry-row'+(canManage()?' clickable':'')+'"'+(canManage()?' onclick="noteModal(\''+h.n.id+'\')"':'')+'><div style="flex:1;min-width:0">'
      + '<div style="font-size:12px;color:var(--accent);font-weight:700">'+h.label+'</div>'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px">'+(k!=='note'?'<span class="chip" style="font-size:10px">'+km.e+' '+km.label+'</span>':'')+(h.n.title?'<span style="font-weight:700;font-size:14px">'+esc(h.n.title)+'</span>':'')+'</div>'
      + (h.n.text?'<div style="font-size:13px;white-space:pre-wrap;margin-top:2px">'+esc(h.n.text)+'</div>':'')
      + '</div></div>';
  }).join('') + '</div>';
}
// ── Walk helper — paw-safety warnings + the nicest walk window, from the cached header weather ──
function renderWalkHelper(){
  const w = headerWeather;
  if(!w || w.tempF == null) return '';
  const fmtHour = t => { const d = new Date(t); if(Math.abs(d.getTime()-Date.now()) < 45*60000) return 'right now'; let hh = d.getHours(); const ap = hh>=12?'PM':'AM'; return ((hh%12)||12)+' '+ap; };
  // pick the most pleasant upcoming daylight hour: closest to 65°F, precip-heavy hours penalized
  let best = null, bs = Infinity;
  (w.hourly||[]).forEach(h => {
    const hr = new Date(h.t).getHours(); if(hr < 6 || hr > 21 || h.tempF == null) return;
    const s = Math.abs(h.tempF - 65) + ((h.pop||0) >= 40 ? 100 : (h.pop||0)/4);
    if(s < bs){ bs = s; best = h; }
  });
  if(w.tempF >= 85){
    return '<div class="card" style="border-color:var(--danger);background:rgba(248,81,73,.07);font-size:13px;line-height:1.5"><strong>🔥 '+w.tempF+'° — check the pavement before walking.</strong> Sunny asphalt can reach paw-burning temps from about 85° air. Back-of-hand test: hold it on the pavement for 7 seconds — too hot for your hand means too hot for paws. Stick to grass and shade'+(best && best.tempF <= w.tempF-6 ? ', or wait for '+fmtHour(best.t)+' ('+best.tempF+'°)' : '')+'.</div>';
  }
  if(w.tempF <= 15){
    return '<div class="card" style="border-color:var(--blue);background:rgba(88,166,255,.07);font-size:13px;line-height:1.5"><strong>🥶 '+w.tempF+'° — short-walk weather.</strong> Watch for paw lifting or shivering, and rinse paws after — road salt and ice-melt irritate pads'+(best && best.tempF >= w.tempF+6 ? '. Warmest window: '+fmtHour(best.t)+' ('+best.tempF+'°)' : '')+'.</div>';
  }
  if(best && Math.abs(best.tempF - 65) <= 13){
    return '<div class="card" style="font-size:13px;display:flex;align-items:center;gap:10px"><span style="font-size:20px">'+(best.emoji||'🌤️')+'</span><div><strong>Nice walk window:</strong> '+fmtHour(best.t)+' — '+best.tempF+'°'+((best.pop!=null&&best.pop>0)?' · '+best.pop+'% precip':'')+'</div></div>';
  }
  return '';
}
// ── Daily routine checklist (opt-in via Settings) — ticks itself off from today's logs ──
function renderRoutineCard(){
  const s = data.settings || {};
  if(!s.routineOn) return '';
  const times = (s.routineFeedTimes||[]).slice().sort();
  const today = todayISO();
  const feedsToday = petLogs('feed').filter(l=>l.dateTime && l.dateTime.slice(0,10)===today).length;
  const walkDone = petLogs('walk').some(l=>l.dateTime && l.dateTime.slice(0,10)===today);
  const waterDone = petLogs('water').some(l=>l.dateTime && l.dateTime.slice(0,10)===today);
  const nowHM = new Date().toTimeString().slice(0,5);
  const items = [];
  times.forEach((t,i)=>{ const done = feedsToday > i; items.push({ label:'Feed at '+fmtClock(t), done, late: !done && nowHM > t }); });
  if(s.routineWalk) items.push({ label:'Walk', done:walkDone });
  if(s.routineWater) items.push({ label:'Fresh water', done:waterDone });
  if(!items.length) return '';
  const doneN = items.filter(i=>i.done).length;
  return '<div class="card"><h3 class="section-title">✅ Today\'s routine <span style="font-family:JetBrains Mono,monospace;font-size:12px;color:var(--text-secondary);font-weight:400">'+doneN+'/'+items.length+'</span></h3>'
    + items.map(i=>'<div style="display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px'+(i.done?';color:var(--text-secondary)':'')+'">'
      + '<span style="width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px;'+(i.done?'background:var(--success);color:#fff':'border:2px solid '+(i.late?'var(--warning)':'var(--border)'))+'">'+(i.done?'✓':'')+'</span>'
      + '<span style="'+(i.done?'text-decoration:line-through':'')+'">'+esc(i.label)+'</span>'
      + (i.late?'<span class="chip" style="font-size:10px;background:rgba(210,153,34,.15);color:var(--warning)">overdue</span>':'')
      + '</div>').join('')
    + '</div>';
}

const LOG_META = { feed:{i:'fed',c:'var(--accent)'}, water:{i:'water',c:'var(--blue)'}, potty:{i:'potty',c:'var(--accent-2)'}, walk:{i:'walk',c:'var(--success)'}, weight:{i:'weight',c:'var(--accent-purple)'} };
function logSummary(l){
  if(l.type==='feed') return [l.amount?esc(l.amount)+' '+esc(l.unit||''):'', esc(l.foodType||'Food'), l.foodPlace?'@ '+esc(l.foodPlace):''].filter(Boolean).join(' · ');
  if(l.type==='water') return 'Refilled fresh water'+(l.place?' @ '+esc(l.place):'');
  if(l.type==='potty'){ const wx = l.weather ? l.weather.emoji+' '+l.weather.tempF+'°' : ''; const rest = [l.place?esc(l.place):'', l.stool?esc(l.stool)+' stool':'', wx].filter(Boolean); return esc(l.result||'Potty') + (rest.length ? ' — ' + rest.join(' · ') : ''); }
  if(l.type==='walk'){
    let route = '';
    if(l.from || l.to) route = [esc(l.from), esc(l.to)].filter(Boolean).join(l.roundTrip ? ' ↔ ' : ' → ') + (l.roundTrip && !(l.from && l.to) ? ' (round trip)' : '');
    else if(l.roundTrip) route = 'round trip';
    const wx = l.weather ? l.weather.emoji+' '+l.weather.tempF+'°' : '';
    return [l.durationMin?esc(l.durationMin)+' min':'', l.distance?esc(l.distance)+' mi':'', route, wx].filter(Boolean).join(' · ') || 'Walk';
  }
  if(l.type==='weight') return esc(l.value)+' '+esc(l.unit||'lb');
  return '';
}
// ── Global search — plain substring matching over everything already in memory. No AI, no network. ──
function searchModal(){
  if(!activePet()){ promptAddDog(); return; }
  openModal('<h3>🔍 Search</h3>'
    + '<input class="input" id="gs-q" placeholder="Food brand, vet name, symptom, “first swim”…" oninput="runSearch()" autocomplete="off">'
    + '<div id="gs-results" style="margin-top:4px"><p style="font-size:12px;color:var(--text-secondary)">Searches activity logs, care records, supplies, the journal, and contacts for this dog.</p></div>');

function runSearch(){
  const out = document.getElementById('gs-results'); if(!out) return;
  const q = (fv('gs-q')||'').trim().toLowerCase();
  if(q.length < 2){ out.innerHTML = '<p style="font-size:12px;color:var(--text-secondary)">Type at least 2 characters.</p>'; return; }
  const hit = (...parts) => parts.some(v => v && String(v).toLowerCase().includes(q));
  const groups = [];
  const add = (title, rows) => { if(rows.length) groups.push({ title, rows: rows.slice(0,8), more: rows.length > 8 ? rows.length - 8 : 0 }); };
  const row = (icon, label, sub, open) => ({ icon, label, sub, open });
  add('Activity', petLogs().filter(l => l.dateTime && hit(logSummary(l).replace(/<[^>]+>/g,''), l.notes, l.place, l.foodType, l.from, l.to, l.stool))
    .sort((a,b)=>new Date(b.dateTime)-new Date(a.dateTime))
    .map(l => row((LOG_META[l.type]&&LOG_META[l.type].i)||'log', logSummary(l).replace(/<[^>]+>/g,''), fmtDateTime(l.dateTime), "editLogModal('"+l.id+"')")));
  const care = [];
  petArr('vetVisits').forEach(v => { if(hit(v.reason, v.vet, v.clinic, v.notes)) care.push(row('vet', (v.reason||'Vet visit')+(v.vet?' · '+v.vet:''), fmtDate(v.date), "vetModal('"+v.id+"')")); });
  petArr('grooming').forEach(g => { if(hit(g.groomer, (g.services||[]).join(' '), g.notes)) care.push(row('groom', (g.services&&g.services.length?g.services.join(', '):'Grooming')+(g.groomer?' · '+g.groomer:''), fmtDate(g.date), "groomModal('"+g.id+"')")); });
  petArr('meds').forEach(m => { if(hit(m.name, m.kind, m.dose, m.notes)) care.push(row('meds', m.name+(m.kind?' ('+m.kind+')':''), m.lastGiven?('last '+fmtDate(m.lastGiven)):'', "medModal('"+m.id+"')")); });
  petArr('records').forEach(r => { if(hit(r.name, r.type, r.vaccineType, r.result, r.vet, r.clinic, r.notes)) care.push(row('records', (r.name||r.type||'Record'), fmtDate(r.date), "recordModal('"+r.id+"')")); });
  petArr('illnesses').forEach(e => { if(hit(e.diagnosis, (e.symptoms||[]).join(' '), e.treatment, e.notes)) care.push(row('illness', e.diagnosis||(e.symptoms||[]).slice(0,3).join(', ')||'Illness', fmtDate(e.start), "illnessModal('"+e.id+"')")); });
  add('Care', care);
  add('Supplies', petArr('inventory').filter(i => hit(i.name, i.brand, i.category, i.store, i.upc, i.asin, i.notes))
    .map(i => row('supplies', ((i.brand?i.brand+' ':'')+(i.name||'')).trim(), [i.category, i.purchaseDate?fmtDate(i.purchaseDate):''].filter(Boolean).join(' · '), "invModal('"+i.id+"')")));
  add('Journal', petArr('journal').filter(n => hit(n.title, n.text))
    .map(n => row('log', (JOURNAL_KINDS[journalKind(n)].e+' '+(n.title||String(n.text||'').split('\n')[0].slice(0,50))), n.dateTime?fmtDate(n.dateTime):'', "noteModal('"+n.id+"')")));
  add('Contacts', (data.contacts||[]).filter(c => hit(c.name, c.org, c.role, c.phone, c.email, c.notes))
    .map(c => row('contacts', (c.name||c.org||'Contact')+(c.role?' · '+c.role:''), c.phone||'', "contactModal('"+c.id+"')")));
  if(!groups.length){ out.innerHTML = '<p style="font-size:13px;color:var(--text-secondary)">No matches for “'+esc(q)+'”.</p>'; return; }
  out.innerHTML = groups.map(g =>
    '<div class="label" style="margin:12px 0 4px">'+esc(g.title)+'</div>'
    + g.rows.map(r => '<div class="entry-row clickable" onclick="closeModal();setTimeout(function(){'+r.open+'},0)" style="padding:8px 12px;margin-bottom:6px"><span style="display:inline-flex;flex-shrink:0">'+svgIcon(r.icon,16)+'</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis">'+esc(r.label)+'</div>'+(r.sub?'<div style="font-size:11px;color:var(--text-secondary)">'+esc(r.sub)+'</div>':'')+'</div></div>').join('')
    + (g.more ? '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px">+ '+g.more+' more — refine the search</div>' : '')
  ).join('');
}

function saveEditLog(id){

  else if(l.type === 'walk'){ l.durationMin = fv('e-dur'); l.distance = fv('e-dist'); l.from = fv('e-from'); l.to = fv('e-to'); l.roundTrip = document.getElementById('e-round').checked; }
  else if(l.type === 'weight'){ l.value = fv('e-w'); }
  logChange('edited', LOG_ENTITY[l.type]||'activity', (logSummary(l)||'').replace(/<[^>]+>/g,''));

}

function renderLog(){
  if(!activePet()) return emptyState();
  const tabs = [['feed','Feed'],['water','Water'],['potty','Potty'],['walk','Walk'],['weight','Weight'],['journal','Journal']];
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px"><h2 style="font-size:20px;font-weight:700">Log activity</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" onclick="openActivity()">'+svgIcon('log',16)+' All activity by day</button><button class="btn btn-sm" onclick="openHistory()">🕘 Change history</button></div></div>';
  html += '<div class="subtab">'+tabs.map(([k,l])=>'<button class="'+(logSubtab===k?'active':'')+'" onclick="setLogSubtab(\''+k+'\')">'+svgIcon((LOG_META[k]&&LOG_META[k].i)||'log',16)+' '+l+'</button>').join('')+'</div>';
  // Journal & milestones lives in data.journal, not logs — reuse the Profile card here so it's reachable from Log too.
  if(logSubtab === 'journal') return html + renderNotes();
  const opener = { feed:'quickFeed', water:'quickWater', potty:'quickPotty', walk:'quickWalk', weight:'quickWeight' }[logSubtab];
  html += '<div class="card" style="text-align:center;padding:18px"><button class="btn-primary" style="max-width:300px" onclick="'+opener+'()">+ Add '+logSubtab+' entry</button></div>';
  const entries = petLogs(logSubtab).filter(l=>l.dateTime).sort((a,b)=>new Date(b.dateTime)-new Date(a.dateTime));
  if(!entries.length) return html + '<div class="card empty"><div class="ico">'+svgIcon(LOG_META[logSubtab].i,46)+'</div><p style="color:var(--text-secondary)">No '+logSubtab+' entries yet.</p></div>';
  // group by date
  let lastDate = '';
  html += '<div class="card">';
  entries.forEach(l => {
    const d = l.dateTime.slice(0,10);

  });
  html += '</div>';
  return html;
}

const JOURNAL_KINDS = { first:{e:'🌟',label:'First'}, milestone:{e:'🏆',label:'Milestone'}, memory:{e:'❤️',label:'Memory'}, funny:{e:'😂',label:'Funny moment'}, note:{e:'📝',label:'Note'} };
function journalKind(n){ return JOURNAL_KINDS[n.kind] ? n.kind : 'note'; } // legacy entries had no kind
let journalFilter = 'all';
function setJournalFilter(k){ journalFilter = k; render(); }
function renderNotes(){
  const all = petArr('journal').slice().sort((a,b)=>new Date(b.dateTime||0)-new Date(a.dateTime||0));
  const kindsPresent = [...new Set(all.map(journalKind))];
  if(journalFilter !== 'all' && !kindsPresent.includes(journalFilter)) journalFilter = 'all';

    html += '<div class="tag-grid" style="margin-bottom:10px">'+fbtn('all','All')+kindsPresent.map(k=>fbtn(k, JOURNAL_KINDS[k].e+' '+JOURNAL_KINDS[k].label)).join('')+'</div>';
  }
  if(notes.length) html += notes.map(n=>{

}

function saveNote(id){
  if(denyManage()) return;
  draftCommit();
  if(!activePet()){ promptAddDog(); return; }
  const text = fv('nt-text'), title = (fv('nt-title')||'').trim();
  if(!text && !title){ showToast('⚠️ Give it a title or write what happened'); return; }
  const kEl = document.querySelector('#nt-kind .tag.active');
  const f = { kind:(kEl?kEl.dataset.k:'note'), title:title, text:text, dateTime:fv('nt-dt')||nowLocalISO() };
  data.journal = data.journal || [];
  if(id){ data.journal = data.journal.map(x=>x.id===id ? {...x, ...f} : x); }
  else { data.journal.unshift({ id:genId(), petId:data.activePetId, ...f }); }
  logChange(id?'edited':'added','journal entry', (JOURNAL_KINDS[f.kind].label+': '+(title||text)).slice(0,60));
  closeModal(); save(); showToast(JOURNAL_KINDS[f.kind].e+' Saved to the journal');
}
function deleteNote(id){
  if(denyManage()) return;
  data.journal = (data.journal||[]).filter(x=>x.id!==id);
  markDeleted(id);
  logChange('deleted','note','');
  closeModal(); save(); showToast('🗑️ Deleted');
}

// ── CALENDAR ──
function navCalMonth(delta){
  const base = calMonth || (function(){ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })();
  let m = base.m + delta, y = base.y;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  calMonth = {y, m};
  document.getElementById('view-calendar').innerHTML = renderCalendar();
}
function renderCalendar(){
  if(!activePet()) return emptyState();
  const events = calendarEvents();
  const view = calMonth || (function(){ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })();
  const monthName = new Date(view.y, view.m, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  // group events by yyyy-mm-dd
  const byDay = {};
  events.forEach(e => { const k = (e.date||'').slice(0,10); (byDay[k] = byDay[k]||[]).push(e); });
  let html = '<h2 style="font-size:20px;font-weight:700;margin-bottom:16px">Calendar</h2>'+draftStrip('calendar');
  // Google Calendar control card
  html += '<div class="card"><h3 class="section-title">'+svgIcon('calendar',18)+' Google Calendar</h3>';
  if(!currentUser){
    html += '<p style="color:var(--text-secondary);font-size:14px;margin-bottom:12px">Sign in with Google to push vet, grooming and med dates straight to your calendar.</p>'
      + '<button class="btn btn-outline" onclick="connectGoogleCalendar()">Sign in &amp; connect Google Calendar</button>';
  } else if(!gcalAccessToken){
    html += '<p style="color:var(--text-secondary);font-size:14px;margin-bottom:12px">Connect Google Calendar to sync '+activePet().name+'’s schedule into a calendar of your choice.</p>'
      + '<button class="btn btn-outline" onclick="connectGoogleCalendar()">'+svgIcon('link',15)+' Connect Google Calendar</button>';
  } else {
    const dog = esc(activePet().name);
    if(!data.settings.gcalCalendarId && !gcalChoosing){
      // First run: recommend a dedicated calendar named after the dog (name editable).
      const defName = '🐾 ' + activePet().name + ' — PawPrints';
      html += '<p style="font-size:14px;color:var(--text-secondary);margin-bottom:12px">Where should '+dog+'’s schedule go? We recommend a dedicated calendar just for '+dog+' — you can rename or switch it anytime.</p>';
      html += '<label class="label">New calendar name</label><input class="input" id="gcal-newname" value="'+esc(defName)+'">';
      html += '<button class="btn-primary" style="width:auto;padding:12px 22px;font-size:14px" onclick="createDogCalendar(document.getElementById(\'gcal-newname\').value)">➕ Create '+dog+'’s calendar</button>';
      html += '<div style="margin-top:12px;font-size:12px;color:var(--text-secondary)">Prefer an existing one? <a style="color:var(--accent-2);cursor:pointer;font-weight:500" onclick="useExistingCalendar()">Choose a calendar</a> · <a style="color:var(--accent-2);cursor:pointer;font-weight:500" onclick="setTargetCalendar(\'primary\')">use my Primary calendar</a></div>';
    } else {
      const target = data.settings.gcalCalendarId || 'primary';
      const cals = (window._gcalCalendars && window._gcalCalendars.length) ? window._gcalCalendars.slice() : [{ id:'primary', name:'Primary calendar', primary:true }];
      if(!cals.find(c=>c.id===target)) cals.unshift({ id:target, name:(target==='primary'?'Primary calendar':target) });
      html += '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">';
      html += '<div style="flex:1;min-width:200px"><label class="label">Write to calendar</label><select class="select" style="margin-bottom:0" onchange="setTargetCalendar(this.value)">'
        + cals.map(c=>'<option value="'+esc(c.id)+'"'+(target===c.id?' selected':'')+'>'+esc(c.name)+(c.primary?' (primary)':'')+'</option>').join('')
        + '</select></div>';
      html += '<button class="btn-primary" style="width:auto;padding:12px 20px;font-size:14px" onclick="syncToGoogleCalendar()">🔄 Sync schedule</button>';
      html += '</div>';
      html += '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'
        + '<button class="btn btn-sm" onclick="createDogCalendar()">'+svgIcon('add',15)+' New calendar for '+dog+'</button>'
        + (target!=='primary' ? '<button class="btn btn-sm" onclick="renameCalendarModal()">'+svgIcon('edit',15)+' Rename calendar</button>' : '')
        + (window._gcalCalendars ? '' : '<button class="btn btn-sm" onclick="window._gcalCalendars=null;loadCalendarList()">↻ Load my calendars</button>')
        + '</div>';
    }
    html += '<p style="font-size:12px;color:'+(gcalPersistent?'var(--success)':'var(--text-secondary)')+';margin-top:10px">'
      + (gcalPersistent ? '✓ Connected — reconnects automatically on every device. ' : '⏱ Connected for this session only (set up pawprints-worker for permanent connect). ')
      + 'Syncs vet visits, follow-ups, grooming (+ next-due), and med due-dates'+(data.settings.gcalCalendarId?' to the calendar above':'')+'. Re-syncing updates the same events, no duplicates. (You can share the calendar with others from Google Calendar.)</p>';
    if(gcalPersistent) html += '<button class="btn btn-sm btn-danger" style="margin-top:4px" onclick="disconnectGoogleCalendar()">Disconnect Google Calendar</button>';
  }
  html += '<div style="margin-top:12px"><button class="btn btn-sm" onclick="exportICS()">'+svgIcon('download',15)+' Download .ics</button></div>';
  html += '</div>';
  if(canManage()) html += '<div class="card" style="text-align:center;padding:16px"><button class="btn-primary" style="max-width:320px" onclick="eventModal()">+ Add reminder / event</button><div style="font-size:11px;color:var(--text-secondary);margin-top:8px">Custom reminders show on the calendar and sync to Google Calendar with everything else.</div></div>';
  // Month grid
  const first = new Date(view.y, view.m, 1), startDow = first.getDay(), daysIn = new Date(view.y, view.m+1, 0).getDate();
  const todayK = todayISO();
  html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><button class="btn btn-sm" onclick="navCalMonth(-1)">‹</button><div style="font-weight:700;font-size:16px">'+monthName+'</div><button class="btn btn-sm" onclick="navCalMonth(1)">›</button></div>';
  html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
  ['S','M','T','W','T','F','S'].forEach(d => html += '<div style="text-align:center;font-size:11px;color:var(--text-secondary);font-weight:600;padding:4px 0">'+d+'</div>');
  for(let i=0;i<startDow;i++) html += '<div></div>';
  for(let day=1; day<=daysIn; day++){
    const k = view.y+'-'+pad(view.m+1)+'-'+pad(day);
    const evs = byDay[k] || [];
    const isToday = k === todayK;
    html += '<div style="min-height:58px;border-radius:8px;border:1px solid '+(isToday?'var(--accent)':'var(--border)')+';background:'+(isToday?'rgba(244,162,97,.08)':'var(--bg-tertiary)')+';padding:4px 5px;overflow:hidden">'
      + '<div style="font-size:11px;color:'+(isToday?'var(--accent)':'var(--text-secondary)')+';font-weight:'+(isToday?'700':'400')+'">'+day+'</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:2px">'
        + evs.slice(0,4).map(e=>'<span onclick="'+e.open+'" title="'+esc(e.title)+'" style="cursor:pointer;font-size:12px;line-height:1">'+iconFor(e.icon,15)+'</span>').join('')
        + (evs.length>4?'<span style="font-size:9px;color:var(--text-secondary);align-self:center">+'+(evs.length-4)+'</span>':'')
      + '</div></div>';
  }
  html += '</div></div>';
  // Upcoming list
  const upcoming = events.filter(e => { const d = (e.date||'').slice(0,10); return e.record ? d > todayK : d >= todayK; }).slice(0,12);
  html += '<div class="card"><h3 class="section-title">Upcoming</h3>';
  if(!upcoming.length) html += '<p style="color:var(--text-secondary);font-size:14px">Nothing scheduled. Add a vet visit, grooming, or med to populate the calendar.</p>';
  else html += upcoming.map(e=>'<div class="entry-row clickable" onclick="'+e.open+'"><div><div style="font-weight:600;font-size:14px">'+iconFor(e.icon,16)+' '+esc(e.title.replace(/^\S+\s/,''))+'</div><div style="font-size:12px;color:var(--text-secondary)">'+esc(e.type)+(e.time?' · '+fmtClock(e.time):'')+'</div></div><div class="tl-time">'+fmtDate(e.date)+(e.time?'<br>'+fmtClock(e.time):'')+'</div></div>').join('');
  html += '</div>';
  return html;
}

function renderCare(){
  if(!activePet()) return emptyState();
  const tabs = [['vet','Vet','vet'],['grooming','Grooming','groom'],['meds','Meds','meds'],['records','Records','records'],['illness','Illness','illness']];
  let html = '<h2 style="font-size:20px;font-weight:700;margin-bottom:16px">Care</h2>'+draftStrip('care');
  html += '<div class="subtab">'+tabs.map(([k,l,ic])=>'<button class="'+(careSubtab===k?'active':'')+'" onclick="setCareSubtab(\''+k+'\')">'+svgIcon(ic,16)+' '+l+'</button>').join('')+'</div>';
  if(careSubtab==='vet') html += renderVetTab();
  else if(careSubtab==='grooming') html += renderGroomTab();
  else if(careSubtab==='meds') html += renderMedsTab();
  else if(careSubtab==='records') html += renderRecordsTab();
  else html += renderIllnessTab();
  return html;
}
// Quick-reference panel of the dog's vet(s) from their profile, shown atop the Vet tab.
function vetPanel(){
  const p = activePet(); if(!p) return '';
  const blk = (title, doctor, clinic, phone, email) => {
    if(!doctor && !clinic && !phone && !email) return '';
    const tel = (phone||'').replace(/[^0-9+]/g,'');
    return '<div style="padding:10px 0;border-top:1px solid var(--border)"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);margin-bottom:3px">'+title+'</div>'
      + '<div style="font-weight:600">'+esc([doctor,clinic].filter(Boolean).join(' · ')||'Vet')+'</div>'
      + ((phone||email)?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+(tel?'<a class="btn btn-sm btn-accent" href="tel:'+esc(tel)+'">'+svgIcon('call',15)+' '+esc(phone)+'</a>':'')+(email?'<a class="btn btn-sm" href="mailto:'+esc(email)+'">✉️ Email</a>':'')+'</div>':'')
      + '</div>';
  };
  const primary = blk('Primary vet', p.vetDoctor, p.vetName, p.vetPhone, p.vetEmail);
  const secondary = blk('Secondary vet', p.vet2Doctor, p.vet2Name, p.vet2Phone, p.vet2Email);

  if(!primary && !secondary) return '<div class="card"><h3 class="section-title" style="margin:0 0 8px">'+svgIcon('care',18)+' '+esc(p.name)+'’s vet</h3><p style="color:var(--text-secondary);font-size:14px;margin:0">No vet saved yet — <a style="color:var(--accent-2);cursor:pointer;font-weight:500" onclick="petModal(\''+p.id+'\')">add your vet</a> in the profile and it shows here.</p></div>';
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="section-title" style="margin:0">'+svgIcon('care',18)+' '+esc(p.name)+'’s vet'+(hasTwo?'s':'')+'</h3><button class="btn btn-sm" onclick="petModal(\''+p.id+'\')">Edit</button></div>'+primary+secondary+'</div>';
}
// ── Vet visit prep sheet — "since the last visit" summary to show or read to the vet ──
let _vetPrepText = '';
function vetPrepModal(){
  if(!activePet()){ promptAddDog(); return; }
  const p = activePet(), today = todayISO();
  const past = petArr('vetVisits').filter(v=>v.date && v.date <= today).sort((a,b)=> b.date < a.date ? -1 : 1);
  const last = past[0] || null, since = last ? last.date : null;
  const inRange = ds => !!ds && (!since || ds > since);
  const S = [];
  // Weight
  const ws = weightsFor(p.id), wNow = ws[0];
  const wPrev = since ? (ws.find(x => x.dateTime && x.dateTime.slice(0,10) <= since) || null) : null;
  const wRows = [];
  if(wNow){
    wRows.push('Current: '+wNow.value+' '+(wNow.unit||'lb')+' ('+fmtDate(wNow.dateTime)+')');
    if(wPrev && wPrev !== wNow && num(wPrev.value) != null && num(wNow.value) != null){
      const d = Math.round((num(wNow.value)-num(wPrev.value))*10)/10;
      wRows.push('Around last visit: '+wPrev.value+' '+(wPrev.unit||'lb')+'  →  change '+(d>0?'+':'')+d+' '+(wNow.unit||'lb'));
    }
  } else wRows.push('No weights recorded yet');
  S.push({ t:'Weight', rows:wRows });
  // Illnesses
  const ills = petArr('illnesses').filter(e=>inRange(e.start));
  S.push({ t:'Illnesses', rows: ills.length ? ills.map(e=>fmtDate(e.start)+(e.recovery?' – '+fmtDate(e.recovery):' (ongoing)')+': '+(e.diagnosis||(e.symptoms||[]).join(', ')||'illness')+(e.severity?' · '+e.severity:'')) : ['None recorded'] });
  // Unusual stools
  const stools = petLogs('potty').filter(l=>l.dateTime && inRange(l.dateTime.slice(0,10)) && l.stool && l.stool !== 'Normal');
  const byType = {}; stools.forEach(l=>{ byType[l.stool] = (byType[l.stool]||0)+1; });
  S.push({ t:'Unusual stools', rows: stools.length ? [stools.length+' non-normal: '+Object.keys(byType).map(k=>k+' ×'+byType[k]).join(', '), 'Most recent: '+fmtDate(stools.sort((a,b)=>new Date(b.dateTime)-new Date(a.dateTime))[0].dateTime)] : ['All normal'] });
  // Meds & preventatives
  const meds = petArr('meds');
  S.push({ t:'Meds & preventatives', rows: meds.length ? meds.map(m=>{ const nd = medNextDue(m); const late = nd && nd < today; return m.name+(m.kind?' ('+m.kind+')':'')+(m.lastGiven?' — last '+fmtDate(m.lastGiven):'')+(nd?' — next '+fmtDate(nd)+(late?'  [OVERDUE]':''):''); }) : ['None tracked'] });
  // Food
  const foods = petArr('inventory').filter(i=>i.category==='Food');
  const cur = foods.filter(i=>invStatus(i)==='In use').map(i=>((i.brand?i.brand+' ':'')+i.name).trim());
  const started = foods.filter(i=>inRange(i.startDate)).map(i=>((i.brand?i.brand+' ':'')+i.name).trim()+' (started '+fmtDate(i.startDate)+')');
  const fRows = [];
  if(cur.length) fRows.push('Current: '+cur.join('; '));
  if(started.length) fRows.push('Changed/opened since: '+started.join('; '));
  if(!fRows.length) fRows.push('No food tracked');
  S.push({ t:'Food', rows:fRows });
  // New care records
  const recs = petArr('records').filter(r=>inRange(r.date));
  if(recs.length) S.push({ t:'New records', rows: recs.map(r=>fmtDate(r.date)+': '+(r.name||r.type||'record')+(r.result?' — '+r.result:'')) });
  // Upcoming
  const upRows = [];
  petArr('vetVisits').forEach(v=>{ if(v.date && v.date > today) upRows.push(fmtDate(v.date)+': '+(v.reason||'vet visit')); if(v.followUpDate && v.followUpDate >= today) upRows.push(fmtDate(v.followUpDate)+': follow-up'+(v.reason?' ('+v.reason+')':'')); });
  if(upRows.length) S.push({ t:'Upcoming', rows:upRows });
  const header = p.name+' — vet prep, '+fmtDate(today)+'\n'+[ageStr(p.birthday,p.birthdayEstimated), p.breed, p.sex].filter(Boolean).join(' · ')
    + '\nCovers: '+(last ? 'since the last visit, '+fmtDate(last.date)+(last.reason?' ('+last.reason+')':'') : 'all recorded history — no past vet visit logged');
  _vetPrepText = header+'\n\n'+S.map(s=>s.t.toUpperCase()+'\n'+s.rows.map(r=>'- '+r).join('\n')).join('\n\n');
  openModal('<h3>📋 Vet visit prep</h3>'
    + '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5">'+esc(p.name)+' · '+[ageStr(p.birthday,p.birthdayEstimated), p.breed].filter(Boolean).map(esc).join(' · ')+'<br>Covers '+(last?('everything since the last visit — <strong>'+fmtDate(last.date)+'</strong>'+(last.reason?' ('+esc(last.reason)+')':'')):'all recorded history (no past vet visit logged)')+'.</div>'
    + S.map(s=>'<div style="margin-bottom:12px"><div class="label" style="margin-bottom:2px">'+esc(s.t)+'</div>'+s.rows.map(r=>'<div style="font-size:13px;line-height:1.5;padding-left:2px">'+esc(r)+'</div>').join('')+'</div>').join('')
    + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn-primary" onclick="copyVetPrep()">📋 Copy as text</button><button class="btn" onclick="closeModal()">Close</button></div>');
}
function copyVetPrep(){
  if(navigator.clipboard && _vetPrepText){ navigator.clipboard.writeText(_vetPrepText).then(()=>showToast('📋 Copied — paste it anywhere')).catch(()=>showToast('⚠️ Couldn\'t copy')); }
  else showToast('⚠️ Couldn\'t copy');
}
function renderVetTab(){

  const card = (v,future) => '<div class="entry-row clickable" onclick="vetModal(\''+v.id+'\')"><div><div style="font-weight:600">'+esc(v.reason||'Vet visit')+'</div><div style="font-size:12px;color:var(--text-secondary)">'+fmtDate(v.date)+(v.time?' · '+fmtClock(v.time):'')+[v.vet?' · '+esc(v.vet):'',v.weight?' · '+esc(v.weight)+(activePet().weightUnit||'lb'):'',(v.lineItems&&v.lineItems.length?' · '+v.lineItems.length+' item'+(v.lineItems.length===1?'':'s'):''),(v.payMethod?' · '+esc(v.payMethod)+(((v.payMethod==='Credit card'||v.payMethod==='Debit card')&&v.ccLast4)?' '+(v.ccBrand?esc(v.ccBrand)+' ':'')+'••'+esc(v.ccLast4):''):'')].join('')+'</div></div><div style="text-align:right">'+(v.cost?'<div style="font-family:JetBrains Mono,monospace;color:var(--success)">'+money(v.cost)+'</div>':'')+'</div></div>';
  if(visits.length) html += dateSortBtn('toggleVetSort', vetSortAsc);
  if(upcoming.length) html += '<div class="card"><h3 class="section-title">Upcoming</h3>'+upcoming.map(v=>card(v,true)).join('')+'</div>';
  if(past.length) html += '<div class="card"><h3 class="section-title">History</h3>'+past.map(v=>card(v,false)).join('')+'</div>';
  if(!visits.length) html += '<div class="card empty"><div class="ico">'+svgIcon('vet',46)+'</div><p style="color:var(--text-secondary)">No vet visits logged yet.</p></div>';
  return html;
}
function renderGroomTab(){

      + '<div class="card stat-card"><div class="stat-value" style="color:var(--success)">'+money(total)+'</div><div class="stat-label">Total spent</div></div></div>';

// Meds bought as vet-visit / grooming line items tagged 💊 — surfaced here (read-only) with cost.

// Lifecycle from the date fields: no start = on-hand inventory, start = in use, end = finished.
function invStatus(i){ if(i.noLifecycle) return 'One-time'; return i.endDate ? 'Finished' : (i.startDate ? 'In use' : 'Inventory'); }
// Only allow http(s) reorder links (reject javascript:/data:/etc.); bare domains get https:// prefixed.
function safeUrl(u){ u=(u||'').trim(); if(!u) return ''; if(/^https?:\/\//i.test(u)) return u; if(/^[a-z][a-z0-9+.\-]*:/i.test(u)) return ''; return 'https://'+u; }

// ── Reorder reminder emails ──
// Push the owner's running-low supplies (+ reorder links) and email prefs to the
// worker, which mails them once a day. Sig-gated so save() can call it freely — it
// only POSTs when the prefs or the low-item set actually changed. See pawprints-worker.
let _lastReorderSig = null;
function reorderItemsForEmail(){
  // Pre-format the purchase context here (same helpers the Supplies view uses)
  // so the worker stays a dumb renderer: how long it's been in use so far,
  // its cost, where it was bought, and the purchase date. Blanks are dropped.
  return (data.inventory||[]).filter(i => i && i.runningLow).map(i => ({
    name: ((i.brand?i.brand+' ':'')+(i.name||'')).trim(),
    url: safeUrl(i.reorderUrl) || amazonUrl(i) || '',
    duration: invDurationText(i) || '',
    purchased: i.purchaseDate ? fmtDate(i.purchaseDate) : '',
    cost: i.cost ? money(i.cost) : '',
    store: (i.store||'').trim(),
  })).filter(i => i.name);
}
async function syncReorderPrefs(force){
  try {
    if(!currentUser || demoMode || sharedOwnerUid) return; // only the signed-in owner syncs their own prefs
    const s = data.settings || {};
    const enabled = !!s.reorderEmailOn;
    const email = (s.reorderEmail||'').trim();
    const items = (enabled && email) ? reorderItemsForEmail() : [];
    const sig = JSON.stringify({ enabled, email, items });
    if(!force && sig === _lastReorderSig) return;
    _lastReorderSig = sig;
    await workerFetch('/reorder/sync', { method:'POST', body: JSON.stringify({ enabled, email, items }) });
  } catch(e){ _lastReorderSig = null; /* leave dirty so the next change retries */ }
}
// Accepts a bare ASIN or a pasted Amazon product URL; returns the uppercased 10-char ASIN ('' if absent).
function normalizeAsin(v){ v=(v||'').trim(); if(!v) return ''; const m = v.match(/(?:\/dp\/|\/gp\/product\/|\/gp\/aw\/d\/)([A-Za-z0-9]{10})/) || v.match(/^([A-Za-z0-9]{10})$/); return m ? m[1].toUpperCase() : v; }
function amazonUrl(i){ const a = ((i&&i.asin)||'').trim().toUpperCase(); return /^[A-Z0-9]{10}$/.test(a) ? 'https://www.amazon.com/dp/'+a : ''; }
function amazonLink(i){ const u = amazonUrl(i); return u ? '<a class="btn btn-sm btn-accent" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open this product on Amazon">🛒 Amazon</a>' : ''; }
function reorderLink(i){ const u = safeUrl(i && i.reorderUrl); const az = amazonLink(i); return (u ? '<a class="btn btn-sm btn-accent" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Reorder this item — opens the product page">↗ Reorder</a>' : '') + (u && az ? ' ' : '') + az; }
function daysBetween(a, b){ if(!a||!b) return null; const d1 = new Date(a+'T00:00'), d2 = new Date(b+'T00:00'); if(isNaN(d1)||isNaN(d2)) return null; return Math.round((d2-d1)/86400000); }
// "5 days in use" while open, or "used 20 days" once finished.
function invDurationText(i){
  if(i.startDate && !i.endDate){ const d = daysBetween(i.startDate, todayISO()); if(d==null || d<0) return ''; return d===0 ? 'in use today' : d+' day'+(d===1?'':'s')+' in use'; }
  if(i.startDate && i.endDate){ const d = daysBetween(i.startDate, i.endDate); if(d==null || d<0) return ''; return 'used '+d+' day'+(d===1?'':'s'); }
  return '';
}
function invStatusChip(i){
  const s = invStatus(i);
  if(s==='One-time') return '<span class="chip" style="background:var(--bg-tertiary);color:var(--text-secondary);font-size:10px">One-time</span>';
  if(s==='In use') return '<span class="chip-2" style="font-size:10px">In use</span>';
  if(s==='Finished') return '<span class="chip" style="background:var(--bg-tertiary);color:var(--text-secondary);font-size:10px">Finished</span>';
  return '<span class="chip" style="background:var(--bg-tertiary);color:var(--text-secondary);font-size:10px">Inventory</span>';
}
// Small-value money: adds precision for sub-dollar rates like $0.04/oz so they don't round to $0.00.
function moneyRate(n){ const v = parseFloat(n); if(isNaN(v)) return ''; const a = Math.abs(v); return '$' + (a<0.1 ? v.toFixed(3) : v.toFixed(2)); }
// Parse a package size like "5 lb", "30 ct", "12 oz" → {n, unit}. null if no leading number.
function parseSize(s){ if(!s) return null; const m = String(s).trim().match(/^([\d.]+)\s*([a-zA-Z]+)?/); if(!m) return null; const n = parseFloat(m[1]); if(isNaN(n)||n<=0) return null; return { n, unit:(m[2]||'').toLowerCase() }; }
// Cost-per-day and cost-per-unit for items flagged trackCost. null when not computable.
function invCostBreakdown(i){
  if(!i || !i.trackCost) return null;
  const cost = num(i.cost); if(cost==null || cost<=0) return null;
  const out = {}, qty = num(i.qty) || 1, sz = parseSize(i.size);
  // per-unit: cost ÷ (qty × package size) → per oz/ct/lb; else ÷ qty → per count
  if(sz && qty>0){ out.perUnit = cost/(qty*sz.n); out.perUnitLabel = '/'+(sz.unit||'unit'); }
  else if(qty>0){ out.perUnit = cost/qty; out.perUnitLabel = '/'+(i.unit||'ea'); }
  // per-day: only once the item is actually in use — cost ÷ days from Started to Finished (or today).
  // Unopened inventory (no Started date) has no per-day cost yet, so it's omitted.
  if(i.startDate){ const days = daysBetween(i.startDate, i.endDate || todayISO()); if(days!=null) out.perDay = cost/Math.max(1,days); }
  return (out.perUnit!=null || out.perDay!=null) ? out : null;
}

let _h2cLoading = null;
function loadHtml2Canvas(){
  if(typeof html2canvas === 'function') return Promise.resolve();
  if(_h2cLoading) return _h2cLoading;
  _h2cLoading = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload=res; s.onerror=()=>{_h2cLoading=null;rej(new Error('load failed'));}; document.head.appendChild(s); });
  return _h2cLoading;
}

// Range toggle (30d / 90d / YTD) for the Spending and Potty breakdown cards.
const RANGES = [{k:'7',label:'7d'},{k:'14',label:'14d'},{k:'30',label:'30d'},{k:'90',label:'90d'},{k:'ytd',label:'YTD'},{k:'all',label:'Lifetime'}];
let spendRange = 'ytd', pottyRange = '30';
function rangeInfo(k){
  if(k==='all') return { ms:0, label:'entire history' };
  if(k==='ytd'){ const y=new Date().getFullYear(); return { ms:new Date(y+'-01-01T00:00').getTime(), label:'year so far' }; }
  const days = parseInt(k,10)||30; return { ms:Date.now()-days*86400000, label:'last '+days+' days' };
}
// "Jun 9, 2026 → Jul 9, 2026" span shown under an active range toggle. earliestMs anchors the
// "from" side for the Lifetime range (falls back to today when there's no data).
function fmtSpan(fromMs, toMs){ const f = d => new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); return f(fromMs)+' → '+f(toMs); }
function rangeSpanLine(k, earliestMs){ const from = (k==='all') ? (earliestMs||Date.now()) : rangeInfo(k).ms; return '<div class="range-span">'+fmtSpan(from, Date.now())+'</div>'; }
function rangeToggle(kind, cur){
  const fn = kind==='spend' ? 'setSpendRange' : 'setPottyRange';
  return '<div class="range-seg">'+RANGES.map(r=>'<button class="'+(cur===r.k?'active':'')+'" onclick="'+fn+'(\''+r.k+'\')">'+r.label+'</button>').join('')+'</div>';
}

// Spending breakdown card — vet / grooming / supplies within the selected range.
function renderSpendCard(){
  const anySpend = petArr('vetVisits').some(v=>num(v.cost)) || petArr('grooming').some(g=>num(g.cost)) || petArr('inventory').some(i=>num(i.cost));
  if(!anySpend) return '';
  const R = rangeInfo(spendRange);
  const inR = d => d && new Date(d+'T00:00').getTime() >= R.ms;
  const spendVet = petArr('vetVisits').filter(v=>inR(v.date)).reduce((s,v)=>s+(num(v.cost)||0),0);
  const spendGroom = petArr('grooming').filter(g=>inR(g.date)).reduce((s,g)=>s+(num(g.cost)||0),0);
  const spendSupplies = petArr('inventory').filter(i=>inR(i.purchaseDate)).reduce((s,i)=>s+(num(i.cost)||0),0);
  const spendTotal = spendVet+spendGroom+spendSupplies;
  const dateMs = d => d ? new Date(d+'T00:00').getTime() : NaN;
  const allDates = [...petArr('vetVisits').map(v=>dateMs(v.date)), ...petArr('grooming').map(g=>dateMs(g.date)), ...petArr('inventory').map(i=>dateMs(i.purchaseDate))].filter(t=>!isNaN(t));
  const earliest = allDates.length ? Math.min(...allDates) : Date.now();
  const bar = (label,val,color)=>{ const pct = spendTotal?Math.round(val/spendTotal*100):0; return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>'+label+'</span><span style="font-family:JetBrains Mono,monospace;color:'+color+'">'+money(val)+'</span></div><div style="height:7px;background:var(--bg-tertiary);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+color+';border-radius:4px"></div></div></div>'; };
  return '<div class="card">'+panelHead(svgIcon('spend',18)+' Spending — '+money(spendTotal), rangeToggle('spend', spendRange), 'spending')
    + rangeSpanLine(spendRange, earliest)
    + (spendTotal>0
        ? bar(svgIcon('vet',16)+' Vet', spendVet, 'var(--blue)') + bar(svgIcon('groom',16)+' Grooming', spendGroom, 'var(--accent)') + bar(svgIcon('supplies',16)+' Food & supplies', spendSupplies, 'var(--success)')
        : '<p style="font-size:12px;color:var(--text-secondary);margin:0">No spending recorded in the '+R.label+'.</p>')
    + '</div>';
}
// Potty breakdown card — counts, avg gaps, and popular spots within the selected range.
function renderPottyCard(){
  const all = petLogs('potty');
  if(!all.length) return '';
  const R = rangeInfo(pottyRange);
  const potty = all.filter(p=>p.dateTime && new Date(p.dateTime).getTime() >= R.ms);
  const allMs = all.map(p=>new Date(p.dateTime).getTime()).filter(t=>!isNaN(t));
  const earliest = allMs.length ? Math.min(...allMs) : Date.now();
  const head = '<div class="card">'+panelHead(svgIcon('potty',18)+' Potty breakdown', rangeToggle('potty', pottyRange), 'potty-breakdown')+rangeSpanLine(pottyRange, earliest);
  if(!potty.length) return head + '<p style="font-size:12px;color:var(--text-secondary);margin:0">No potty breaks in the '+R.label+'.</p></div>';
  const counts = {}; potty.forEach(p=>{ const r=p.result||'Pee'; counts[r]=(counts[r]||0)+1; });
  // Pee/poop classifiers — a recorded stool counts as a poop even if the result was tagged Pee.
  const isPee = p => { const r = p.result||''; return r==='Pee' || r==='Both'; };
  const isPoop = p => { const r = p.result||''; return r==='Poop' || r==='Both' || !!(p.stool && String(p.stool).trim()); };
  const peeN = potty.filter(isPee).length, poopN = potty.filter(isPoop).length;
  const avgGapHrs = (pred) => {
    const times = potty.filter(p=>p.dateTime && pred(p)).map(p=>new Date(p.dateTime).getTime()).sort((a,b)=>a-b);
    if(times.length < 2) return null;
    let sum=0; for(let i=1;i<times.length;i++) sum += times[i]-times[i-1];
    return (sum/(times.length-1))/3600000;
  };
  const fmtGap = (h) => h==null ? '—' : (h>=24 ? (h/24).toFixed(1)+'d' : h.toFixed(1)+'h');
  const peeGap = avgGapHrs(isPee), poopGap = avgGapHrs(isPoop);
  const spots = {};
  potty.forEach(p => {
    const place = (p.place||'').trim() || 'Unspecified';
    if(!spots[place]) spots[place] = { pee:0, poop:0, total:0 };
    if(isPee(p)) spots[place].pee++;
    if(isPoop(p)) spots[place].poop++;
    spots[place].total++;
  });
  const spotList = Object.entries(spots).sort((a,b)=>b[1].total-a[1].total);
  const spotDigits = Math.max(1, ...spotList.flatMap(([,c])=>[c.pee,c.poop]).map(n=>String(n).length));
  return head + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">'+Object.entries(counts).map(([k,v])=>'<span class="chip-2" style="cursor:pointer" title="View these potty breaks" onclick="pottyResultDetail(\''+esc(k)+'\')">'+esc(k)+': '+v+'</span>').join('')+'</div>'
    + '<div class="grid-2"><div class="timing-box" style="cursor:pointer" title="View all pees" onclick="pottyTypeDetail(\'pee\')"><div class="timing-value" style="color:var(--accent-2)">'+fmtGap(peeGap)+'</div><div class="timing-label">💧 Avg between pees</div></div>'
    + '<div class="timing-box" style="cursor:pointer" title="View all poops" onclick="pottyTypeDetail(\'poop\')"><div class="timing-value" style="color:var(--accent)">'+fmtGap(poopGap)+'</div><div class="timing-label">💩 Avg between poops</div></div></div>'
    + '<p style="font-size:11px;color:var(--text-secondary);margin-top:8px">Average time between consecutive potty breaks over the <strong>'+R.label+'</strong> ('+peeN+' pee'+(peeN===1?'':'s')+', '+poopN+' poop'+(poopN===1?'':'s')+'). A "Both" — or any entry where you noted a stool — counts as a poop. Needs at least 2 of each.</p>'
    + '<div style="font-size:13px;font-weight:600;margin:16px 0 8px">'+svgIcon('spots',15)+' Popular spots</div>'
    + spotList.map(([place, c]) => '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border)"><span style="flex:1;min-width:0;font-size:13px;font-weight:600">'+esc(place)+' <span style="font-size:11px;color:var(--text-secondary);font-weight:400">· '+c.total+' visit'+(c.total===1?'':'s')+'</span></span><span style="display:flex;gap:6px;flex-shrink:0"><span class="chip-2" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px" title="View these pees" onclick="pottySpotDetail(\'pee\',\''+encArg(place)+'\')">💧<span style="font-family:\'JetBrains Mono\',ui-monospace,monospace;display:inline-block;min-width:'+spotDigits+'ch;text-align:right">'+c.pee+'</span></span><span class="chip" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px" title="View these poops" onclick="pottySpotDetail(\'poop\',\''+encArg(place)+'\')">💩<span style="font-family:\'JetBrains Mono\',ui-monospace,monospace;display:inline-block;min-width:'+spotDigits+'ch;text-align:right">'+c.poop+'</span></span></span></div>').join('')
    + '</div>';
}

}

// ── Insights "Trends" chart (selectable metric / style / range) ──
function trendControlsHTML(){
  const metricBtns = TREND_METRICS.map(m=>'<button class="'+(trendMetric===m.k?'active':'')+'" onclick="setTrend(\'metric\',\''+m.k+'\')">'+svgIcon(m.icon,16)+' '+m.label+'</button>').join('');
  const seg = (kind,val,label)=>'<button class="'+(String((kind==='style'?trendStyle:trendRange))===String(val)?'active':'')+'" onclick="setTrend(\''+kind+'\',\''+val+'\')">'+label+'</button>';
  const styleBtns = [['auto','Auto'],['line','Line'],['bar','Bar'],['area','Area']].map(([v,l])=>seg('style',v,l)).join('');
  const rangeBtns = [['7','7d'],['14','14d'],['30','30d'],['90','90d'],['all','Lifetime']].map(([v,l])=>seg('range',v,l)).join('');
  const days = trendSpanDays();
  const spanLine = '<div class="range-span" style="margin:0 0 10px">'+fmtSpan(Date.now()-(days-1)*86400000, Date.now())+'</div>';
  return '<div class="subtab" style="margin-bottom:10px">'+metricBtns+'</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px"><div class="range-seg">'+styleBtns+'</div><div class="range-seg" style="margin-left:auto">'+rangeBtns+'</div></div>'
    + spanLine;
}
// Resolve trendRange to a day count — 'all' spans from the first entry OF THE CHARTED METRIC to
// today (so e.g. the walk trend starts at your first walk, not an earlier weigh-in or feeding).
function trendSpanDays(){
  if(trendRange!=='all') return +trendRange;
  const type = trendMetric==='feeding' ? 'feed' : (trendMetric==='walkdist' ? 'walk' : trendMetric);
  const dates = petLogs(type).map(l=>(l.dateTime||'').slice(0,10)).filter(Boolean).sort();
  if(!dates.length) return 7;
  const d = daysBetween(dates[0], todayISO());
  return Math.max(7, (d==null?0:d) + 1); // inclusive of the first entry's day
}
function setTrend(kind, val){
  if(kind==='metric') trendMetric=val; else if(kind==='style') trendStyle=val; else if(kind==='range') trendRange=(val==='all'?'all':+val);
  // Refresh only the Trends controls + its chart — leave the weight chart above untouched.
  const c = document.getElementById('trend-controls'); if(c) c.innerHTML = trendControlsHTML();
  const h = document.getElementById('trend-hint'); if(h) h.textContent = (TREND_METRICS.find(m=>m.k===trendMetric)||{}).hint || '';
  drawTrendChart();
}
function shortDay(iso){ const p=(iso||'').split('-'); return p.length===3 ? (+p[1])+'/'+(+p[2]) : iso; }
function hexA(h, a){ h=(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); if(isNaN(n)) return h; return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
function trendDays(n){ const out=[]; const now=new Date(); for(let i=n-1;i>=0;i--){ const d=new Date(now.getTime()-i*86400000); out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`); } return out; }
function trendData(){
  const days=trendDays(trendSpanDays()), idx={}; days.forEach((d,i)=>idx[d]=i);
  const css=getComputedStyle(document.documentElement), C=(n,f)=>css.getPropertyValue(n).trim()||f;
  const teal=C('--accent-2','#2dd4bf'), orange=C('--accent','#f4a261'), purple=C('--accent-purple','#a371f7');
  const meta=TREND_METRICS.find(m=>m.k===trendMetric)||TREND_METRICS[0];
  let datasets=[];
  if(trendMetric==='feeding'){
    const a=days.map(()=>0); petLogs('feed').forEach(l=>{ const d=(l.dateTime||'').slice(0,10); if(d in idx && num(l.amount)!=null) a[idx[d]]+=num(l.amount); });
    datasets=[{label:'Amount fed',data:a,color:teal}];
  } else if(trendMetric==='potty'){
    const pee=days.map(()=>0), poop=days.map(()=>0);
    const isPee=p=>{const r=p.result||'';return r==='Pee'||r==='Both';}, isPoop=p=>{const r=p.result||'';return r==='Poop'||r==='Both'||!!(p.stool&&String(p.stool).trim());};
    petLogs('potty').forEach(l=>{ const d=(l.dateTime||'').slice(0,10); if(d in idx){ if(isPee(l))pee[idx[d]]++; if(isPoop(l))poop[idx[d]]++; } });
    datasets=[{label:'Pee',data:pee,color:teal},{label:'Poop',data:poop,color:orange}];
  } else if(trendMetric==='walk'){
    const a=days.map(()=>0); petLogs('walk').forEach(l=>{ const d=(l.dateTime||'').slice(0,10); if(d in idx && num(l.durationMin)!=null) a[idx[d]]+=num(l.durationMin); });
    datasets=[{label:'Walk minutes',data:a,color:purple}];
  } else if(trendMetric==='walkdist'){
    const a=days.map(()=>0); petLogs('walk').forEach(l=>{ const d=(l.dateTime||'').slice(0,10); if(d in idx && num(l.distance)!=null) a[idx[d]]+=num(l.distance); });
    datasets=[{label:'Miles walked',data:a,color:teal}];
  } else {
    const a=days.map(()=>null); petLogs('weight').filter(l=>num(l.value)!=null).sort((x,y)=>new Date(x.dateTime)-new Date(y.dateTime)).forEach(l=>{ const d=(l.dateTime||'').slice(0,10); if(d in idx) a[idx[d]]=num(l.value); });
    datasets=[{label:'Weight',data:a,color:orange}];
  }
  return { days, datasets, auto:meta.auto };
}
function drawTrendChart(){
  const view=document.getElementById('view-'+currentView); if(!view) return;
  if(!view.querySelector('.trend-chart')) return;
  loadChart().then(()=>{
    const v2=document.getElementById('view-'+currentView), c2=v2?v2.querySelector('.trend-chart'):null; if(!c2) return;
    if(trendsChart){ try{trendsChart.destroy();}catch(e){} trendsChart=null; }
    const {days,datasets,auto}=trendData();
    const style=trendStyle==='auto'?auto:trendStyle;
    const chartType=style==='bar'?'bar':'line', fill=style==='area';
    const css=getComputedStyle(document.documentElement), txt=css.getPropertyValue('--text-secondary').trim()||'#8b949e', grid=css.getPropertyValue('--border').trim()||'#30363d';
    const ds=datasets.map(d=>({ label:d.label, data:d.data, borderColor:d.color, backgroundColor: chartType==='bar'?d.color:hexA(d.color,.15), tension:.3, fill:fill, spanGaps:true, borderWidth:2, pointRadius: trendMetric==='weight'?3:0, pointBackgroundColor:d.color, borderRadius: chartType==='bar'?3:0, maxBarThickness:22 }));
    trendsChart=new Chart(c2.getContext('2d'), { type:chartType, data:{ labels:days.map(shortDay), datasets:ds }, options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false,mode:'index'}, plugins:{legend:{display:datasets.length>1, labels:{color:txt,boxWidth:12}}}, scales:{ x:{ticks:{color:txt,maxTicksLimit:7,autoSkip:true},grid:{display:false}}, y:{beginAtZero:trendMetric!=='weight', ticks:{color:txt},grid:{color:grid}} } } });
  }).catch(()=>{});
}

// Refresh "time ago" status on Today every minute
setInterval(() => { if(currentView==='today' && !document.getElementById('modal-root').innerHTML){ document.getElementById('view-today').innerHTML = renderToday(); } }, 60000);
// Re-pull from the cloud when the app comes back to the foreground (throttled).
// Without this, a phone tab / home-screen app that stays alive for days only ever
// syncs down at its last cold start and never sees other devices' changes.
function resyncFromCloud(){
  if(!currentUser || !firebaseReady || demoMode) return;
  if(Date.now() - lastCloudPull < 30000) return;
  loadFromFirestore(true);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') resyncFromCloud(); });
window.addEventListener('pageshow', e => { if(e.persisted) resyncFromCloud(); });

function bootFirebase(){ if(typeof firebase==='undefined'){ setTimeout(bootFirebase,200); return; } initFirebase(); }
if('requestIdleCallback' in window) requestIdleCallback(bootFirebase,{timeout:3000});
else window.addEventListener('load',()=>setTimeout(bootFirebase,100));
</script>

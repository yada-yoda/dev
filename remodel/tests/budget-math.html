<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RemodelHQ — budget math tests</title>
<style>
  body { font-family: "Inter", system-ui, sans-serif; max-width: 820px; margin: 0 auto;
         padding: 28px 18px 60px; color: #14171b; line-height: 1.55; }
  h1 { font-size: 24px; letter-spacing: -.025em; margin-bottom: 4px; }
  p.lead { color: #6d7278; margin-bottom: 22px; }
  #summary { padding: 12px 14px; border-radius: 8px; font-weight: 600; margin-bottom: 18px; }
  .pass { background: #eaf5ee; color: #2c7a52; }
  .fail { background: #fdecea; color: #a03a2a; }
  ol { list-style: none; padding: 0; }
  li { border-bottom: 1px solid #e4e6e9; padding: 9px 0; font-size: 14px;
       display: flex; gap: 10px; align-items: baseline; }
  li:last-child { border-bottom: none; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; flex: 0 0 auto; }
  .tag.ok { background: #eaf5ee; color: #2c7a52; }
  .tag.no { background: #fdecea; color: #a03a2a; }
  .why { color: #6d7278; font-size: 12.5px; }
  code { font-family: ui-monospace, Consolas, monospace; background: #f2f3f5;
         border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
</style>
</head>
<body>
<h1>Budget math</h1>
<p class="lead">Checks the money rollup in <code>store.js</code> without a database or a
sign-in. Open this file over http (not <code>file://</code>) and it runs itself.</p>
<div id="summary">Running…</div>
<ol id="results"></ol>

<script type="module">
import { rollup, expenseTotal, upcomingPayments, rollupByProject } from "../store.js?v=0.6.2";

const results = [];
const near = (a, b) => Math.abs((a ?? 0) - (b ?? 0)) < 0.005;

function check(name, actual, expected, why) {
  const ok = typeof expected === "number" ? near(actual, expected) : actual === expected;
  results.push({ name, ok, why, detail: ok ? "" : `expected ${expected}, got ${actual}` });
}

const row = (kind, total, extra = {}) => ({ kind, total, ...extra });

// ---------- the case that matters most ----------
// A contractor bills 4,200 and is then paid 4,200. That is one real cost of
// 4,200, not 8,400. Invoiced and paid must stay independent.
{
  const r = rollup([row("invoice", 4200), row("payment", 4200)], { approvedBudget: 10000 });
  check("An invoice and its payment do not double count", r.paid, 4200,
    "paid counts payments and purchases only");
  check("The same pair still reports what was billed", r.invoiced, 4200);
  check("Nothing is left outstanding once it is settled", r.outstanding, 0);
  check("Remaining budget subtracts only money actually gone", r.remaining, 5800);
}

// ---------- outstanding ----------
{
  const r = rollup([row("invoice", 5000), row("payment", 2000)]);
  check("Partly paid invoice leaves the balance outstanding", r.outstanding, 3000);
}
{
  const r = rollup([row("invoice", 1000), row("payment", 1500)]);
  check("Paying ahead never shows a negative balance due", r.outstanding, 0,
    "floored at zero rather than reporting a debt owed to you");
}

// ---------- purchases, refunds, credits ----------
{
  const r = rollup([row("purchase", 186.42)]);
  check("An outright purchase counts as paid", r.paid, 186.42);
  check("An outright purchase also counts as committed", r.committed, 186.42);
  check("An outright purchase is not an invoice", r.invoiced, 0);
}
{
  const r = rollup([row("purchase", 500), row("refund", 120), row("credit", 30)]);
  check("Refunds and credits reduce what was actually paid", r.paid, 350);
  check("Money returned is reported separately", r.refunds, 150);
}

// ---------- estimates never count as spend ----------
{
  const r = rollup([row("estimate", 9500)], { approvedBudget: 8000 });
  check("An estimate is not money spent", r.paid, 0);
  check("An estimate is not a commitment", r.committed, 0);
  check("An estimate is reported on its own", r.estimate, 9500);
  check("An estimate does not eat the remaining budget", r.remaining, 8000);
}

// ---------- variance ----------
{
  const r = rollup([row("committed", 12000)], { approvedBudget: 10000 });
  check("Committing more than approved shows positive variance", r.variance, 2000);
}
{
  const r = rollup([row("committed", 8000)], { approvedBudget: 10000 });
  check("Committing under approved shows negative variance", r.variance, -2000);
}
{
  const r = rollup([row("purchase", 100)], null);
  check("With no approved budget, remaining is not invented", r.remaining, null);
  check("With no approved budget, variance is not invented", r.variance, null);
}

// ---------- empty and rounding ----------
{
  const r = rollup([], { approvedBudget: 5000 });
  check("No activity means nothing paid", r.paid, 0);
  check("No activity leaves the whole budget", r.remaining, 5000);
}
{
  const r = rollup([row("purchase", 0.1), row("purchase", 0.2)]);
  check("Cents add up without floating point drift", r.paid, 0.3,
    "0.1 + 0.2 must report as 0.30, not 0.30000000000000004");
}

// ---------- line totals ----------
check("Total is subtotal plus tax and shipping", expenseTotal(100, 8.25, 12.5), 120.75);
check("Missing tax and shipping are treated as zero", expenseTotal(100), 100);
check("Line totals round to cents", expenseTotal(10.005, 0, 0), 10.01);

// ---------- grouping ----------
{
  const rows = [
    row("payment", 1000, { projectId: "a" }),
    row("invoice", 1000, { projectId: "a" }),
    row("purchase", 250, { projectId: "b" }),
    row("purchase", 75, { projectId: null })
  ];
  const byProject = rollupByProject(rows, { a: { approvedBudget: 5000 } });
  check("Each project rolls up on its own", byProject.a.paid, 1000);
  check("A project's invoice does not leak into another", byProject.b.paid, 250);
  check("Unassigned spend is grouped separately", byProject[""].paid, 75);
}

// ---------- upcoming payments ----------
{
  const d = (s) => new Date(s + "T00:00:00");
  const rows = [
    row("invoice", 100, { dueDate: d("2026-09-01") }),
    row("invoice", 200, { dueDate: d("2026-08-01") }),
    row("payment", 300, { dueDate: d("2026-07-01") }),
    row("invoice", 400, {})
  ];
  const due = upcomingPayments(rows);
  check("Only invoices with a due date are upcoming", due.length, 2,
    "payments are already settled; an invoice with no due date has no deadline");
  check("Soonest due comes first", due[0].total, 200);
}

// ---------- render ----------
const failed = results.filter((r) => !r.ok).length;
const summary = document.getElementById("summary");
summary.className = failed ? "fail" : "pass";
summary.textContent = failed
  ? `${failed} of ${results.length} checks failed`
  : `All ${results.length} checks passed`;

document.getElementById("results").innerHTML = results.map((r) => `
  <li>
    <span class="tag ${r.ok ? "ok" : "no"}">${r.ok ? "PASS" : "FAIL"}</span>
    <span>${r.name}${r.why ? `<br><span class="why">${r.why}</span>` : ""}
      ${r.detail ? `<br><span class="why">${r.detail}</span>` : ""}</span>
  </li>`).join("");
</script>
</body>
</html>

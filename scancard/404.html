<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="0.2.0">
  <title>Page not found · Scan Card</title>
  <meta name="description" content="That URL on Scan Card doesn't exist — the link may be broken, or the page may have moved.">
  <link rel="canonical" href="https://dev.rizzo.cc/scancard/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#1a2238">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #0f1320;
      --surface: #1a2238;
      --border: #2e3858;
      --text: #f0f3fb;
      --text-muted: #9aa3c0;
      --primary: #4d7bf5;
      --primary-hover: #6a91ff;
      --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      padding: 36px 28px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .card img.logo {
      display: block;
      margin: 0 auto 18px;
      border-radius: 12px;
    }
    .code {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 0 22px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }
    .btn:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .footer {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .footer .brand {
      font-weight: 600;
      color: var(--text);
    }
    .footer .version { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img src="favicon.svg" alt="" class="logo" width="56" height="56">
      <div class="code">Error 404</div>
      <h1>Page not found</h1>
      <p>The link you followed may be broken, or the page may have been moved. The app itself is working fine — just not this URL.</p>
      <a href="/scancard/" class="btn">Back to Scan Card</a>
      <div class="footer">
        <span class="brand">Scan Card</span>
        <span class="version">v0.2.0</span>
      </div>
    </section>
  </main>
</body>
</html>
